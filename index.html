 addNews('Boletim econômico mensal',`PIB ${fmt(e.gdp,2)} tri; crescimento de ${fmt(e.growth,1)}%; inflação em ${fmt(e.inflation,1)}%; câmbio de referência ${esc(game.currencySymbol||'R$')} ${fmt(e.dollar,2)}; resultado mensal ${net>=0?'+':''}${fmt(net,1)} bi após juros.`,'📈',net>=0?'good':'warn');
 if(net<0){addNews('Alerta fiscal: despesas superam receitas',`O orçamento fechou o mês com déficit de ${moneyFmt(-net)}. O custo dos juros foi ${moneyFmt(monthlyInterest)} e a dívida avançou para ${fmt(e.debt,1)}% do PIB.`,'⚠️','bad');}
 const eventEvery=([5,4,3,2,2][(game.difficultyLevel||3)-1]||3);
 if(game.monthCount%eventEvery===0){queueGameEvent(eventForCurrentConditions());}
 // Eventos estruturais não dependem do calendário aleatório nem da popularidade.

 }

 beginElectionCampaign();

}
function advanceDays(days){if(!game||game.ended&&!game.continueAfterTerm){toast('O mandato foi encerrado. Consulte o relatório final.');return;}if(game.election?.status==='campaign'){showElectionModal();toast('Resolva a eleição antes de avançar o calendário.');return;}for(let i=0;i<days;i++){if(game.election?.status==='campaign')break;game.date.day++;const dt=new Date(game.date.year,game.date.month,game.date.day);if(dt.getMonth()!==game.date.month){game.date.month=dt.getMonth();game.date.year=dt.getFullYear();game.date.day=1;monthProcess();if(game.election?.status==='campaign')break;}}saveGame();render();if(game.election?.status==='campaign')showElectionModal();else showNextQueuedEvent();}
function advanceToDate(target){
 if(!game)return;
 const wanted=new Date(target+'T12:00:00'), current=new Date(game.date.year,game.date.month,game.date.day,12);
 if(Number.isNaN(wanted.getTime())||wanted<=current){toast('Escolha uma data posterior à data atual.');return;}
 const days=Math.round((wanted-current)/86400000);
 if(days>1461){toast('O calendário permite avançar no máximo quatro anos.');return;}

}

function applyEffects(eff){const e=game.economy,p=game.politics;Object.entries(eff||{}).forEach(([k,v])=>{if(k==='cash')game.treasury+=v;else if(k==='approval')p.approval=clamp(p.approval+v,5,92);else if(k==='stability')p.stability=clamp(p.stability+v,5,95);else if(k==='congress')p.congressMood=clamp(p.congressMood+v,5,95);else if(k==='unemployment')e.unemployment=clamp(e.unemployment+v,2,25);else if(k==='inflation')e.inflation=clamp(e.inflation+v,.2,30);else if(k==='growth')e.growth=clamp(e.growth+v,-8,9);else if(k==='exports')e.exports+=v;else if(k==='diplomacy')game.countries.forEach(c=>c.relation=clamp(c.relation+v*.5,5,95));else if(k==='health')p.health=clamp(p.health+v,5,95);else if(k==='education')p.education=clamp(p.education+v,5,95);else if(k==='security'){game.security.organizedCrime=clamp(game.security.organizedCrime-v,5,100);p.security=clamp(p.security+v,5,95);}else if(k==='defense')game.security.defense=clamp(game.security.defense+v,5,100);else if(k==='environment')game.budget.categories.meioAmbiente+=v*1.5;else if(k==='revenue')e.revenueAnnual+=v*10;else if(k==='states')game.states.forEach(s=>{s.development=clamp(s.development+v*.15,10,100);s.approval=clamp(s.approval+v*.5,10,95);});});p.rejection=100-p.approval;}
function showEventModal(){if(!game?.activeEvent)return;const ev=game.activeEvent;openModal('🚨 '+esc(ev.title),`<p>${esc(ev.desc)}</p><div class="tag">Acontecimento • ${dateLabel(ev.created)}</div><div style="margin-top:14px">${ev.choices.map((c,i)=>{let cost=Math.max(0,-(c.effects?.cash||0));let blocked=game.treasury<cost;return `<button class="event-choice" data-action="event-choice" data-index="${i}" ${blocked?'disabled':''}><span><b>${esc(c.label)}</b><small>${esc(c.detail)}${blocked?' · Caixa insuficiente':''}</small></span><span>›</span></button>`}).join('')}</div>`);}
function chooseEvent(i){let ev=game.activeEvent;if(!ev)return;let c=ev.choices[i];let cost=Math.max(0,-(c.effects?.cash||0));if(game.treasury<cost){toast('Caixa insuficiente para essa resposta.');return;}applyEffects(c.effects);game.events.unshift({date:todayISO(),title:ev.title,choice:c.label,category:ev.category||'event'});if(ev.category==='crisis'&&game.crisisHistory?.[0])game.crisisHistory[0].resolved=true;logDecision(c.label,ev.title);addNews('Resposta presidencial: '+c.label,`O governo respondeu a "${ev.title}". ${c.detail}`,'🏛️','neutral');game.activeEvent=null;if(game.eventQueue?.length)game.activeEvent=game.eventQueue.shift();saveGame();closeModal();render();toast('Decisão registrada. Os efeitos já foram aplicados.');if(game.activeEvent)showEventModal();}

function performanceScore(){const p=game.politics,e=game.economy;let economy=clamp(50+(e.growth*5)-(e.inflation-4)*2-(e.unemployment-7)*1.8,0,100),health=p.health,stability=p.stability,purchasing=clamp(65-(e.inflation-4)*5+(e.growth*2),0,100),army=game.security.defense,approval=p.approval,crises=clamp(100-game.events.length*4,0,100),wars=100,influence=game.countries.reduce((s,c)=>s+c.relation,0)/game.countries.length,promise=game.proposal.completion;let total=economy*.16+health*.1+stability*.12+purchasing*.1+army*.08+approval*.14+crises*.08+wars*.05+influence*.08+promise*.09;return{economy,health,stability,purchasing,army,approval,crises,wars,influence,promise,total};}

function proposeLaw(type){const presets={tributaria:['Reforma tributária simplificada','Unifica regras e reduz distorções entre setores.','R$ 4 bi','Pode elevar produtividade, mas exige transição.','Médio', {growth:.18,approval:1,revenue:8}],administrativa:['Reforma administrativa','Reorganiza carreiras e processos da administração pública.','R$ 2 bi','Pode melhorar eficiência no longo prazo, com resistência corporativa.','Baixo', {growth:.12,stability:-1}],educacao:['Plano nacional de aprendizagem','Amplia jornada escolar, formação docente e avaliação.','R$ 18 bi','Eleva indicadores educacionais gradualmente.','Alto',{education:6,approval:2,cash:-18}],seguranca:['Marco de integração da segurança','Cria metas e cooperação entre União e estados.','R$ 7 bi','Pode fortalecer inteligência e investigação.','Médio',{security:5,approval:1,cash:-7}],previdencia:['Ajuste previdenciário gradual','Revisa regras de transição e sustentabilidade.','R$ 3 bi','Melhora o equilíbrio fiscal, com custo político.','Baixo',{revenue:14,approval:-2,stability:-2}],ambiental:['Lei de proteção e restauração ambiental','Amplia fiscalização e incentivos à restauração.','R$ 6 bi','Melhora ambiente e pode gerar atritos em setores produtivos.','Médio',{environment:4,cash:-6,approval:1}],habitacao:['Programa Casa e Cidade','Financia habitação popular e urbanização.','R$ 22 bi','Gera empregos e reduz déficit habitacional.','Alto',{growth:.15,approval:3,cash:-22}],industria:['Programa de inovação industrial','Crédito e incentivos para tecnologia e manufatura.','R$ 12 bi','Estimula produtividade e exportações.','Médio',{growth:.22,exports:5,cash:-12}],pec:['PEC do pacto federativo','Redefine responsabilidades e fontes de financiamento entre União, estados e municípios.','R$ 5 bi','Pode melhorar coordenação federativa, mas exige quórum constitucional.','Alto',{stability:2,growth:.1,cash:-5},true],transporte:['Plano nacional de mobilidade','Amplia transporte coletivo, integração urbana e logística regional.','R$ 14 bi','Exige coordenação com governos regionais e contratos plurianuais.','Médio',{growth:.12,approval:1,cash:-14}],energia:['Programa de transição energética','Financia redes, eficiência e diversificação da matriz energética.','R$ 16 bi','Requer investimento inicial e planejamento de longo prazo.','Alto',{growth:.16,approval:1,cash:-16,environment:3}],digital:['Lei de serviços digitais','Define padrões de transparência, proteção de dados e serviços públicos digitais.','R$ 3 bi','A implementação depende de capacidade técnica e fiscalização.','Médio',{growth:.08,stability:1,cash:-3}],saneamento:['Marco de saneamento e água','Amplia metas de abastecimento, tratamento de água e esgoto.','R$ 11 bi','Resultados são graduais e dependem de obras locais.','Médio',{health:3,approval:1,cash:-11}],ciencia:['Fundo de ciência e tecnologia','Amplia financiamento competitivo para pesquisa e inovação.','R$ 8 bi','Retorno econômico ocorre no médio e longo prazo.','Médio',{growth:.14,cash:-8}],cultura:['Plano nacional de cultura','Apoia equipamentos culturais, patrimônio e produção regional.','R$ 4 bi','A execução depende de editais e cooperação regional.','Baixo',{approval:1,cash:-4}]};let x=presets[type];if(!x)return;game.politics.lawsProposed.push(newProposal(...x));logDecision('Projeto apresentado: '+x[0],x[1]);addNews('Governo apresenta projeto de lei',x[0]+' foi enviado ao Congresso Nacional para análise e votação.','📜','neutral');saveGame();render();toast('Projeto protocolado no Congresso.');}
function lawEffect(effect){const p=game.politics,e=game.economy;if(!effect)return;if(effect.budgetCategory&&effect.annualSpend>0){let k=effect.budgetCategory;game.budget.categories[k]=Math.min(1500,(game.budget.categories[k]||0)+effect.annualSpend);}if(Number.isFinite(effect.taxChange)&&effect.taxChange!==0){e.taxRate=clamp(e.taxRate+effect.taxChange,10,45);e.revenueAnnual=clamp(e.revenueAnnual+effect.taxChange*24,1500,4500);}Object.entries(effect).forEach(([k,v])=>{if(['budgetCategory','annualSpend','taxChange','complexity','priority','implementationMonths'].includes(k))return;if(k==='growth')e.growth=clamp(e.growth+v,-8,9);else if(k==='approval')p.approval=clamp(p.approval+v,5,95);else if(k==='cash')game.treasury+=v;else if(k==='revenue')e.revenueAnnual+=v*10;else if(k==='education')p.education=clamp(p.education+v,5,95);else if(k==='health')p.health=clamp(p.health+v,5,95);else if(k==='security'){p.security=clamp(p.security+v,5,95);game.security.police=clamp(game.security.police+v*.6,5,100);}else if(k==='stability')p.stability=clamp(p.stability+v,5,95);else if(k==='exports')e.exports+=v;else if(k==='environment')game.budget.categories.meioAmbiente=Math.min(1500,game.budget.categories.meioAmbiente+v);else if(k==='states')game.states.forEach(st=>st.development=clamp(st.development+v*.1,10,100));});p.rejection=100-p.approval;}
function voteLaw(id){
 let l=game.politics.lawsProposed.find(x=>x.id===id);if(!l)return;
 let cost=Number(String(l.cost).replace(/[^0-9.,]/g,'').replace(',','.'))||0;
 if(game.treasury<cost){toast('Caixa insuficiente para executar a proposta caso ela seja aprovada.');return;}
 openModal('Preparar votação — '+esc(l.title),`<p>Escolha como levar o projeto ao plenário. A articulação custa recursos e não garante aprovação: cada bancada pode votar de forma diferente.</p><div class="stack"><button class="event-choice" data-action="resolve-vote" data-id="${l.id}" data-approach="normal"><span><b>🗳️ Votação normal</b><small>Sem custo extra. Resultado depende das bancadas e do clima político.</small></span><span>›</span></button><button class="event-choice" data-action="resolve-vote" data-id="${l.id}" data-approach="whip" ${game.treasury<3?'disabled':''}><span><b>🤝 Articulação de última hora</b><small>Custa ${esc(game.currencySymbol||'R$')} 3 bi. Melhora a chance de comparecimento e apoio de aliados, sem garantir votos.</small></span><span>›</span></button><button class="event-choice" data-action="resolve-vote" data-id="${l.id}" data-approach="amend" ${game.treasury<1?'disabled':''}><span><b>📝 Negociar um texto de consenso</b><small>Custa ${esc(game.currencySymbol||'R$')} 1 bi. Reduz parte dos efeitos do projeto, mas pode atrair votos de bancadas independentes.</small></span><span>›</span></button></div>`);
}
function resolveLawVote(id,approach='normal'){
 let l=game.politics.lawsProposed.find(x=>x.id===id);if(!l)return;
 let cost=Number(String(l.cost).replace(/[^0-9.,]/g,'').replace(',','.'))||0;
 const extra=approach==='whip'?3:approach==='amend'?1:0;
 if(game.treasury<cost+extra){toast('Caixa insuficiente para essa estratégia de votação.');return;}
 if(extra){game.treasury-=extra;if(approach==='whip')game.politics.congressMood=clamp(game.politics.congressMood+7,5,95);else{game.politics.congressMood=clamp(game.politics.congressMood+4,5,95);if(l.effect){Object.keys(l.effect).forEach(k=>{if(typeof l.effect[k]==='number')l.effect[k]*=.85;});}}}
 const hs=game.houseSeats||513,ss=game.senateSeats||81,r=game.voteRules||{};
 const hNeed=l.constitutional?(r.constitutionalHouse||Math.ceil(hs*.6)):(r.ordinaryHouse||Math.floor(hs/2)+1);
 const sNeed=l.constitutional?(r.constitutionalSenate||Math.ceil(ss*.6)):(r.ordinarySenate||Math.floor(ss/2)+1);
 let yes=0,senYes=0,breakdown=[];
 game.parties.forEach(p=>{
  const ally=game.politics.coalition.includes(p.id)?7:0;
  const ideologyGap=(p.ideology===game.ideology?5:0);
  const resistance=l.political==='Alto'?-12:l.political==='Baixo'?2:-4;
  let chance=clamp(36+p.support*.72+(game.politics.approval-50)*.12+(game.politics.congressMood-50)*.28+ally+ideologyGap+resistance+(approach==='whip'&&ally?8:0)+(approach==='amend'?6:0),4,92);
  let depYes=0,senDepYes=0;

  for(let i=0;i<p.sen;i++)if(Math.random()*100<chance)senDepYes++;
  yes+=depYes;senYes+=senDepYes;breakdown.push(`${p.sigla}: ${depYes}/${p.dep} deputados e ${senDepYes}/${p.sen} senadores`);
 });
 const passes=yes>=hNeed&&senYes>=sNeed,house=game.chamberName||'Câmara',senate=game.senateName||'Senado';
 const result=`${house}: ${yes}/${hs} votos favoráveis (mínimo ${hNeed}). ${senate}: ${senYes}/${ss} (mínimo ${sNeed}).`;
 l.status=passes?'Aprovada':'Rejeitada';l.result=result;l.voteBreakdown=breakdown;
 if(passes){game.politics.pendingSanctions=game.politics.pendingSanctions||[];game.politics.pendingSanctions.push(l);addNews('Projeto aprovado no Legislativo; aguarda decisão do Executivo',l.title+'. '+result,'⚖️','good');}
 else{game.politics.congressMood=clamp(game.politics.congressMood-3,5,95);game.politics.approval=clamp(game.politics.approval-1.2,5,95);addNews('Projeto rejeitado no Legislativo',l.title+'. '+result,'🏛️','bad');}
 game.politics.lawsProposed=game.politics.lawsProposed.filter(x=>x.id!==id);logDecision(passes?'Projeto aprovado: '+l.title:'Projeto rejeitado: '+l.title,result+' Estratégia: '+approach+'.');
 saveGame();closeModal();render();if(passes)showSanctionModal(l.id);else openModal('Projeto rejeitado',`<p>${esc(result)}</p><p><b>Votação por bancada:</b></p><ul>${breakdown.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>O projeto pode ser reapresentado depois de mudanças e nova articulação.</p>`);
}

function showSanctionModal(id){let l=game.politics.pendingSanctions.find(x=>x.id===id);if(!l)return;openModal('Decisão presidencial — '+esc(l.title),`<p>O Congresso aprovou a proposta. Resultado: ${esc(l.result||'Aprovada nas duas casas')}.</p><p><b>Custo estimado:</b> ${esc(l.cost)}. Escolha sancionar ou vetar o projeto. O veto reduz a relação com o Congresso e pode ser derrubado em uma nova rodada futura (não implementada nesta versão).</p>`,`<button class="btn btn-danger" data-action="veto-law" data-id="${l.id}">Vetar projeto</button><button class="btn btn-primary" data-action="sanction-law" data-id="${l.id}">Sancionar lei</button>`);}

function vetoLaw(id){let i=game.politics.pendingSanctions.findIndex(x=>x.id===id);if(i<0)return;let l=game.politics.pendingSanctions.splice(i,1)[0];l.status='Vetada';game.politics.congressMood=clamp(game.politics.congressMood-4,5,95);game.politics.approval=clamp(game.politics.approval-1,5,95);game.politics.rejection=100-game.politics.approval;addNews('Presidência veta projeto aprovado',l.title+' foi vetado pelo presidente; o veto gera tensão com o Congresso.','⚠️','warn');logDecision('Veto presidencial: '+l.title,'A proposta foi vetada após aprovação legislativa.');saveGame();closeModal();render();toast('Veto registrado.');}
function negotiate(pid){
 let p=game.parties.find(x=>x.id===pid);if(!p)return;
 const last=game.politics.lastNegotiation?.[pid]??-99,elapsed=game.monthCount-last;
 if(elapsed<3){toast(`Essa bancada já foi procurada. Aguarde ${3-elapsed} mês(es) para uma nova rodada.`);return;}

}
function resolveNegotiation(pid,kind){
 let p=game.parties.find(x=>x.id===pid);if(!p)return;
 const last=game.politics.lastNegotiation?.[pid]??-99;if(game.monthCount-last<3){toast('Essa bancada já foi procurada recentemente.');return;}
 const cost=kind==='program'?1.5:kind==='concession'?4:0;
 if(game.treasury<cost){toast('Caixa insuficiente para essa negociação.');return;}
 game.treasury-=cost;game.politics.lastNegotiation=game.politics.lastNegotiation||{};game.politics.lastNegotiation[pid]=game.monthCount;
 let chance=kind==='dialogue'?0.42:kind==='program'?0.62:0.76;
 chance+=Math.max(-.12,Math.min(.12,(game.politics.congressMood-50)/250));
 let accepted=Math.random()<chance;
 if(accepted){let gain=kind==='dialogue'?2:kind==='program'?5:8;p.support=clamp(p.support+gain,-35,28);game.politics.congressMood=clamp(game.politics.congressMood+(kind==='concession'?3:1),5,95);if(!game.politics.coalition.includes(pid)&&kind==='concession')game.politics.coalition.push(pid);}
 else{p.support=clamp(p.support-1,-35,28);game.politics.congressMood=clamp(game.politics.congressMood-1,5,95);}
 game.politics.negotiations++;const msg=accepted?`A bancada ${p.sigla} aceitou avançar na conversa. O apoio subiu modestamente.`:`A bancada ${p.sigla} não aceitou os termos. O apoio não avançou.`;
 addNews(accepted?'Negociação política teve avanço':'Negociação política terminou sem acordo',msg,'🤝',accepted?'neutral':'warn');logDecision('Negociação com '+p.sigla,msg);saveGame();closeModal();render();toast(accepted?'Acordo parcial registrado.':'Não houve acordo. Tente outra abordagem após alguns meses.');
}

function appointMinister(ministry){const current=game.ministries[ministry];let candidates=Array.from({length:3},(_,i)=>({name:pick(ministerNames.filter(n=>n!==current.name)),age:rand(35,67),party:pick([game.party,'DC','UP','PLN','PVS','BR']),competence:rand(55,94),loyalty:rand(45,96),popularity:rand(35,82),specialty:pick(['Gestão pública','Economia','Políticas sociais','Direito','Infraestrutura','Articulação política'])}));openModal('Nomear ministro — '+esc(ministry),`<p>Escolha um nome para assumir a pasta. Competência afeta a execução; lealdade e perfil político influenciam a estabilidade do gabinete.</p><div class="stack">${candidates.map((c,i)=>`<button class="event-choice" data-action="choose-minister" data-ministry="${esc(ministry)}" data-candidate="${i}"><span><b>${esc(c.name)}</b><small>${esc(c.party)} • ${esc(c.specialty)}<br>Competência ${c.competence} · Lealdade ${c.loyalty} · Popularidade ${c.popularity}</small></span><span>›</span></button>`).join('')}</div>`);modalAction=()=>{};$('#modalRoot').dataset.candidates=JSON.stringify(candidates);}
function chooseMinister(ministry,index){let cs=JSON.parse($('#modalRoot').dataset.candidates||'[]'),c=cs[index];if(!c)return;game.ministries[ministry]=c;game.politics.stability=clamp(game.politics.stability+(c.loyalty-65)*.025,5,95);addNews('Novo ministro nomeado',`${c.name} assume o Ministério de ${ministry}.`,'🏛️','neutral');logDecision('Nomeação: '+ministry,c.name+' ('+c.party+').');saveGame();closeModal();render();toast(c.name+' nomeado(a).');}
function dismissMinister(ministry){let m=game.ministries[ministry];if(!confirm(`Demitir ${m.name} do Ministério de ${ministry}?`))return;delete game.ministries[ministry];game.politics.stability=clamp(game.politics.stability-1.5,5,95);addNews('Ministro deixa o governo',`${m.name} foi exonerado(a) do Ministério de ${ministry}.`,'📣','warn');logDecision('Demissão no ministério '+ministry,m.name+' deixou o cargo.');saveGame();render();}
function investState(id){let s=game.states.find(x=>x.id===id);if(!s)return;let cost=3;if(game.treasury<cost){toast('Caixa insuficiente para investir R$ 3 bi.');return;}game.treasury-=cost;s.development=clamp(s.development+2.5,0,100);s.approval=clamp(s.approval+4,0,100);s.gdp+=Math.max(1,s.gdp*.003);s.investment+=3;game.investments.push({date:todayISO(),state:s.name,cost});addNews('Investimento federal anunciado',`R$ 3 bi foram direcionados a projetos prioritários em ${s.name}.`,'🏗️','good');logDecision('Investimento em '+s.name,'R$ 3 bilhões em desenvolvimento regional.');saveGame();render();toast('Investimento federal enviado para '+s.name+'.');}
function diplomacy(action,id){let c=game.countries.find(x=>x.id===id);if(!c)return;let cost=action==='agreement'?1.5:action==='visit'?.8:0;if(game.treasury<cost){toast('Caixa insuficiente para esta iniciativa diplomática.');return;}game.treasury-=cost;if(action==='agreement'){c.relation=clamp(c.relation+10,5,95);c.trade+=5;game.diplomaticAgreements.push({date:todayISO(),country:c.name,type:'Acordo comercial'});addNews('Acordo comercial encaminhado',`Brasil e ${c.name} ampliaram a cooperação econômica e comercial.`,'🤝','good');logDecision('Acordo comercial com '+c.name,'Relação diplomática +10; potencial comercial ampliado.');}else if(action==='visit'){c.relation=clamp(c.relation+6,5,95);addNews('Visita diplomática presidencial',`O presidente realizou agenda oficial com representantes de ${c.name}.`,'🌐','good');logDecision('Visita a '+c.name,'Relação diplomática +6.');}else if(action==='sanction'){c.relation=clamp(c.relation-14,5,95);c.trade=Math.max(0,c.trade-8);addNews('Tensão diplomática',`O governo anunciou medidas restritivas em relação a ${c.name}.`,'⚠️','bad');logDecision('Medidas restritivas contra '+c.name,'Relação diplomática -14; comércio potencial reduzido.');}saveGame();render();toast('Ação diplomática registrada.');}
function setPageTitle(){return ({home:'Centro de comando',economy:'Economia nacional',budget:'Orçamento federal',ministries:'Gabinete ministerial',congress:'Congresso Nacional',laws:'Leis e reformas',people:'População e aprovação',states:'Estados e regiões',security:'Segurança e defesa',diplomacy:'Relações internacionais',news:'Notícias e acontecimentos',players:'Disputa contra amigo',history:'Histórico de governos',settings:'Configurações',treasury:'Tesouro e patrimônio',impeachment:'Impeachment',online:'Modo online'})[page]||'BRASIL 2027';}
function navButton(id,icon,label){return `<button data-page="${id}" class="${page===id?'active':''}"><span class="ico">${icon}</span>${label}</button>`;}
function renderShell(){return `<div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="flag"></div><div><b>BRASIL 2027</b><span>${esc(game.countryFlag||'🇧🇷')} ${esc(game.countryName||'Brasil')} · SIMULADOR</span></div></div><div><div class="navgroup-label">Planalto</div><div class="nav">${navButton('home','▦','Centro de comando')}${navButton('ministries','♙','Ministérios')}${navButton('economy','↗','Economia')}${navButton('budget','▤','Orçamento')}${navButton('treasury','🏦','Tesouro e patrimônio')}</div></div><div><div class="navgroup-label">Política e sociedade</div><div class="nav">${navButton('congress','🏛','Congresso')}${navButton('impeachment','⚖️','Impeachment')}${navButton('laws','⚖','Leis e reformas')}${navButton('people','◉','Opinião pública')}${navButton('states','⌖','Regiões')}</div></div><div><div class="navgroup-label">Estado e mundo</div><div class="nav">${navButton('security','⬟','Segurança e defesa')}${navButton('diplomacy','🌐','Diplomacia')}${navButton('news','▣','Notícias')}</div></div><div><div class="navgroup-label">Outros</div><div class="nav">${navButton('players','⚔','Disputa local')}${navButton('online','🌐','Modo online')}${navButton('history','◷','Histórico')}${navButton('settings','⚙','Configurações')}</div></div><div class="sidebar-bottom"><div class="save-status"><i class="dot"></i><span>Salvamento automático ativo</span></div><div class="footer-note">Cenário fictício para entretenimento e estratégia. Os indicadores não são previsões oficiais.</div></div></aside><main class="main"><header class="topbar"><div class="row" style="gap:12px"><button class="icon-btn mobile-menu" data-action="toggle-menu">☰</button><div class="crumb">${esc(game.countryFlag||'🇧🇷')} ${esc(game.countryName||'Brasil')} <span style="color:#476171">/</span> <strong>${setPageTitle()}</strong></div></div><div class="top-actions"><span class="top-pill hide-mobile">📅 ${dateLabel(todayISO())}</span><span class="top-pill">◎ ${fmt(game.politics.approval,0)}% aprovação</span>${alertTopbar()}<button class="icon-btn" title="Salvar agora" data-action="save">↧</button></div></header><section class="content fade">${renderPage()}</section></main></div>`;}
function render(){if(!game){renderMenu();return;}$('#app').innerHTML=renderShell();}
function kpi(label,value,foot,icon,accent='var(--green)'){return `<div class="card kpi" style="--accent:${accent}"><span class="kpi-icon">${icon}</span><div class="kpi-label">${label}</div><div class="kpi-value mono">${value}</div><div class="kpi-foot">${foot}</div></div>`;}
function lineChart(arr,key,color='#36c887',suffix=''){if(!arr||arr.length<2)return `<div class="empty">Dados aparecerão após alguns meses de governo.</div>`;let vals=arr.map(x=>Number(x[key]||0)),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1,w=600,h=150;let pts=vals.map((v,i)=>`${12+i*(w-24)/(vals.length-1)},${h-12-(v-min)/range*(h-28)}`).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="chartGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".3"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${[25,60,95,130].map(y=>`<line x1="0" x2="600" y1="${y}" y2="${y}" stroke="#26404d" stroke-dasharray="3 5"/>`).join('')}<polygon points="${pts} 588,150 12,150" fill="url(#chartGrad)"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${12+i*(w-24)/(vals.length-1)}" cy="${h-12-(v-min)/range*(h-28)}" r="2.6" fill="${color}"/>`).join('')}</svg><div class="chart-labels"><span>${arr[0].date||''}</span><span>${arr[arr.length-1].date||''}</span><span>${fmt(vals[vals.length-1],1)}${suffix}</span></div>`;}
function renderPage(){switch(page){case'home':return homePage();case'economy':return economyPage();case'budget':return budgetPage();case'treasury':return treasuryPage();case'impeachment':return impeachmentPage();case'ministries':return ministriesPage();case'congress':return congressPage();case'laws':return lawsPage();case'people':return peoplePage();case'states':return statesPage();case'security':return securityPage();case'diplomacy':return diplomacyPage();case'news':return newsPage();case'players':return playersPage();case'online':return onlinePage();case'history':return historyPage();case'settings':return settingsPage();default:return homePage();}}
function homePage(){let p=game.politics,e=game.economy,remaining=Math.max(0,(game.termMonths||48)-game.monthCount),years=Math.floor(remaining/12),months=remaining%12;let next=game.election?.status==='campaign'?`<span class="badge bad">Eleições ${game.election.year}</span>`:game.activeEvent?`<span class="badge warn">Decisão pendente</span>`:`<span class="badge good">Governo em atividade</span>`;return `<div class="page-head"><div><div class="eyebrow">Palácio do Planalto · ${game.termMonths===48?'Mandato constitucional':'Simulação'}</div><h1>Bom dia, ${esc(game.president)}.</h1><p>Você está no comando. O país não para — e as consequências também não.</p></div><div class="row"><button class="btn btn-secondary" data-action="advance" data-days="1">+ 1 dia</button><button class="btn btn-secondary" data-action="advance" data-days="7">+ 1 semana</button><button class="btn btn-primary" data-action="advance-month">+ 1 mês <span>→</span></button></div></div><div class="hero" style="margin-bottom:15px"><div class="row" style="justify-content:flex-start;gap:12px"><span class="tag">🇧🇷 ${esc(game.party)}</span><span class="tag">${esc(game.ideology)}</span>${next}</div><h2>Centro de comando presidencial</h2><p>Mandato iniciado em ${game.termStartYear||2027}. Restam <b>${years} anos e ${months} meses</b>. Acompanhe os indicadores, coordene seu gabinete e construa apoio para transformar suas propostas em políticas públicas.</p><div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" data-page="congress">Negociar com o Congresso</button><button class="btn btn-secondary btn-sm" data-page="budget">Administrar orçamento</button><button class="btn btn-secondary btn-sm" data-page="news">Ver jornal nacional</button></div></div><div class="card card-pad" style="margin-bottom:15px"><div class="card-title">Calendário presidencial <span>Selecione uma data futura para processar a simulação</span></div><div class="calendar-panel"><div class="field"><label>Ir para a data</label><input type="date" id="calendarTarget" min="${todayISO()}" max="${game.date.year+8}-12-31" value="${todayISO()}"/></div><button class="btn btn-primary" data-action="calendar-go">Simular até esta data →</button><span class="muted small">Data atual: ${dateLabel(todayISO())}</span></div></div><div class="grid grid-5" style="margin-bottom:15px">${kpi('Aprovação popular',fmt(p.approval,0)+'%',`Rejeição ${fmt(p.rejection,0)}%`,'◎')}${kpi('PIB nacional','R$ '+fmt(e.gdp,2)+' tri',`Crescimento ${e.growth>=0?'+':''}${fmt(e.growth,1)}%`,'↗','var(--blue)')}${kpi('Inflação',fmt(e.inflation,1)+'%',`Juros ${fmt(e.interest,1)}%`,'⌁','var(--yellow)')}${kpi('Desemprego',fmt(e.unemployment,1)+'%',`Salário mínimo R$ ${e.minimumWage.toLocaleString('pt-BR')}`,'♙','var(--purple)')}${kpi('Dívida pública',fmt(e.debt,1)+'% PIB',`Caixa ${moneyFmt(game.treasury)}`,'▤','var(--red)')}</div><div class="split"><div class="stack"><div class="card card-pad"><div class="card-title">Indicadores do país <span>Atualização mensal</span></div><div class="grid grid-2"><div><div class="statline"><span>Estabilidade política</span><b>${fmt(p.stability,0)}/100</b></div><div class="progress"><i style="width:${p.stability}%"></i></div></div><div><div class="statline"><span>Força no Congresso</span><b>${fmt(partySupport(),0)}/100</b></div><div class="progress"><i style="width:${partySupport()}%"></i></div></div><div><div class="statline"><span>Confiança no governo</span><b>${fmt(p.confidence,0)}/100</b></div><div class="progress"><i style="width:${p.confidence}%"></i></div></div><div><div class="statline"><span>Proposta de governo</span><b>${fmt(game.proposal.completion,0)}%</b></div><div class="progress"><i style="width:${Math.min(100,game.proposal.completion)}%"></i></div></div></div><div class="divider"></div><div class="row"><div><b style="font-size:12px">${esc(game.proposal.promise)}</b><div class="muted small">Compromisso apresentado no início do mandato</div></div><span class="badge info">${fmt(game.proposal.completion,0)}% entregue</span></div></div><div class="card card-pad"><div class="card-title">Evolução da aprovação <span>Pesquisas trimestrais</span></div>${lineChart(game.polls.slice().reverse().map(x=>({...x,date:x.date.slice(0,7)})),'approval','#36c887','%')}</div><div class="card card-pad"><div class="card-title">Últimas decisões <span><a href="#" data-page="news" style="color:var(--green)">Ver todas</a></span></div>${game.decisions.length?game.decisions.slice(0,4).map(d=>`<div class="list-item"><div class="row"><b style="font-size:11px">${esc(d.title)}</b><time class="muted tiny">${d.date}</time></div><div class="muted small" style="margin-top:4px">${esc(d.detail)}</div></div>`).join(''):'<div class="empty">Suas decisões aparecerão aqui.</div>'}</div></div><div class="stack"><div class="card card-pad"><div class="card-title">Jornal nacional <span>Mais recentes</span></div>${game.news.slice(0,5).map(n=>`<div class="news-item"><div class="news-icon">${n.icon}</div><div><b>${esc(n.title)}</b><p>${esc(n.desc)}</p><time>${n.date}</time></div></div>`).join('')||'<div class="empty">Nenhuma notícia ainda.</div>'}</div><div class="card card-pad"><div class="card-title">Resumo fiscal <span>R$ bilhões</span></div><div class="row"><span class="muted small">Arrecadação mensal</span><b class="mono">${fmt(game.economy.revenueAnnual*(1+(game.economy.taxRate-26.5)/100*.9)/12,1)}</b></div><div class="row" style="margin-top:10px"><span class="muted small">Despesas mensais + juros</span><b class="mono">${fmt(totalBudget()/12+annualDebtService()/12,1)}</b></div><div class="row" style="margin-top:10px"><span class="muted small">Juros mensais da dívida</span><b class="mono">${fmt(annualDebtService()/12,1)}</b></div><div class="row" style="margin-top:10px"><span class="muted small">Resultado estimado após juros</span><b class="mono ${game.economy.revenueAnnual*(1+(game.economy.taxRate-26.5)/100*.9)>=totalBudget()+annualDebtService()?'green':'red'}">${game.economy.revenueAnnual*(1+(game.economy.taxRate-26.5)/100*.9)>=totalBudget()+annualDebtService()?'+':''}${fmt((game.economy.revenueAnnual*(1+(game.economy.taxRate-26.5)/100*.9)-totalBudget()-annualDebtService())/12,1)}</b></div><div class="divider"></div><div class="statline"><span>Popularidade no Congresso</span><b>${fmt(p.congressMood,0)}/100</b></div><div class="progress"><i style="width:${p.congressMood}%"></i></div><div style="margin-top:13px"><button class="btn btn-secondary btn-sm" style="width:100%" data-page="budget">Abrir painel fiscal →</button></div></div><div class="card card-pad"><div class="card-title">Agenda presidencial <span>${dateLabel(todayISO())}</span></div><div class="stack"><div class="row"><span class="muted small">Mandato restante</span><b class="small">${years}a ${months}m</b></div><div class="progress"><i style="width:${game.monthCount/(game.termMonths||48)*100}%"></i></div><div class="row"><span class="muted small">Ministros ativos</span><b>${Object.keys(game.ministries).length}/16</b></div><div class="row"><span class="muted small">Leis aprovadas</span><b>${p.lawsPassed.length}</b></div><div class="row"><span class="muted small">Investimentos estaduais</span><b>${game.investments.length}</b></div></div></div></div></div>${game.activeEvent?`<div class="card card-pad" style="margin-top:15px;border-color:#765d29"><div class="row"><div><span class="badge warn">Decisão aguardando</span><b style="display:block;margin-top:8px">${esc(game.activeEvent.title)}</b><span class="muted small">Um acontecimento requer sua resposta.</span></div><button class="btn btn-warning" data-action="show-event">Tomar decisão →</button></div></div>`:''}${game.ended?renderEndBanner():''}`;}

 return `<div class="page-head"><div><div class="eyebrow">Painel macroeconômico · ${esc(game.countryName)}</div><h1>Economia nacional</h1><p>Os indicadores e valores são parâmetros de jogo, com moeda local do país selecionado.</p></div><span class="badge info">Cenário ${esc(game.scenario||'regular')}</span></div>

function ministriesPage(){return `<div class="page-head"><div><div class="eyebrow">Equipe presidencial</div><h1>Ministérios e governo</h1><p>Competência melhora a execução. Lealdade e alinhamento ajudam a sustentar a coalizão.</p></div><span class="badge info">${Object.keys(game.ministries).length} pastas preenchidas</span></div><div class="grid grid-2">${ministries.map(m=>{let x=game.ministries[m];if(!x)return `<div class="minister-card"><div class="minister-avatar">＋</div><div class="info"><b>${m}</b><small>Ministério vago</small></div><button class="btn btn-primary btn-sm" data-action="appoint" data-ministry="${m}">Nomear</button></div>`;return `<div class="card card-pad"><div class="row"><div class="minister-card" style="padding:0;border:0;background:none;flex:1"><div class="minister-avatar">${['⚖️','💰','🛡️','🏥','📚','🌳','🌾','🚆','🌐','⚡','🤝','🧰','📊','📡','🎭','⚽'][ministries.indexOf(m)]}</div><div class="info"><b>${esc(x.name)}</b><small>${esc(m)} · ${esc(x.party)}</small></div></div><span class="badge ${x.competence>=75?'good':x.competence<60?'bad':'info'}">${x.competence} competência</span></div><div class="grid grid-3" style="margin-top:12px"><div><div class="statline"><span>Lealdade</span><b>${x.loyalty}</b></div><div class="progress"><i style="width:${x.loyalty}%"></i></div></div><div><div class="statline"><span>Popularidade</span><b>${x.popularity}</b></div><div class="progress"><i style="width:${x.popularity}%"></i></div></div><div><div class="statline"><span>Competência</span><b>${x.competence}</b></div><div class="progress"><i style="width:${x.competence}%"></i></div></div></div><div class="row" style="margin-top:13px"><span class="muted tiny">${esc(x.specialty)} · ${x.age} anos</span><div class="row" style="gap:6px"><button class="btn btn-secondary btn-sm" data-action="appoint" data-ministry="${esc(m)}">Substituir</button><button class="btn btn-danger btn-sm" data-action="dismiss" data-ministry="${esc(m)}">Demitir</button></div></div></div>`}).join('')}</div><div class="card card-pad" style="margin-top:15px"><div class="card-title">Desempenho do gabinete <span>Efeito agregado no governo</span></div><div class="grid grid-3"><div><div class="statline"><span>Competência média</span><b>${fmt(ministryAverage(),1)}/100</b></div><div class="progress"><i style="width:${ministryAverage()}%"></i></div></div><div><div class="statline"><span>Lealdade média</span><b>${fmt(Object.values(game.ministries).reduce((s,x)=>s+x.loyalty,0)/Math.max(1,Object.keys(game.ministries).length),1)}/100</b></div><div class="progress"><i style="width:${Object.values(game.ministries).reduce((s,x)=>s+x.loyalty,0)/Math.max(1,Object.keys(game.ministries).length)}%"></i></div></div><div><div class="statline"><span>Estabilidade</span><b>${fmt(game.politics.stability,1)}/100</b></div><div class="progress"><i style="width:${game.politics.stability}%"></i></div></div></div></div>`;}
function congressPage(){

 <div class="grid grid-4" style="margin-bottom:15px">${kpi(house,String(hs),'Composição da câmara','🏛')}${kpi(senate,String(ss),'Composição do senado','🏛','var(--blue)')}${kpi('Humor do Legislativo',fmt(game.politics.congressMood,0)+'/100','Relação institucional','◎','var(--yellow)')}${kpi('Negociações',String(game.politics.negotiations),'Acordos firmados','🤝','var(--purple)')}</div>
 <div class="split"><div class="card card-pad"><div class="card-title">Composição das bancadas <span>Distribuição fictícia</span></div><div class="table-wrap"><table><thead><tr><th>Partido / grupo</th><th>Perfil de jogo</th><th>${esc(house)}</th><th>${esc(senate)}</th><th>Apoio</th><th>Coalizão</th><th></th></tr></thead><tbody>${parts.map(p=>`<tr><td><b>${esc(p.sigla)}</b><div class="muted tiny">${esc(p.name)}</div></td><td>${esc(p.ideology)}</td><td>${p.dep}</td><td>${p.sen}</td><td><span class="badge ${p.support>=10?'good':p.support<=-10?'bad':'info'}">${p.support>0?'+':''}${p.support}</span></td><td>${coal.includes(p.id)?'<span class="badge good">Aliado</span>':'<span class="badge">Não</span>'}</td><td><button class="btn btn-secondary btn-sm" data-action="negotiate" data-party="${p.id}">Negociar</button></td></tr>`).join('')}</tbody></table></div><p class="footer-note">As bancadas são personagens fictícios do jogo e fecham o total de cadeiras de cada câmara. Negociações têm intervalo mínimo de três meses por bancada; acordos podem falhar e apoio não garante voto.</p></div>

 <div class="card card-pad"><div class="card-title">Pautas pendentes <span>${game.politics.lawsProposed.length}</span></div>${game.politics.lawsProposed.length?game.politics.lawsProposed.map(l=>`<div class="list-item"><b style="font-size:11px">${esc(l.title)}</b><div class="muted tiny" style="margin:4px 0">Apresentada em ${l.date} · Custo ${esc(String(l.cost))}</div><button class="btn btn-primary btn-sm" data-action="vote-law" data-id="${l.id}" ${game.treasury<(Number(String(l.cost).replace(/[^0-9.,]/g,'').replace(',','.'))||0)?'disabled':''}>Colocar em votação</button></div>`).join(''):'<div class="empty">Nenhum projeto aguardando votação.</div>'}</div></div></div>`;

function lawsPage(){let presets=[['tributaria','Reforma tributária','Simplificação de tributos'],['administrativa','Reforma administrativa','Modernização do serviço público'],['educacao','Reforma da educação','Aprendizagem e formação docente'],['seguranca','Reforma da segurança','Integração e inteligência'],['previdencia','Reforma previdenciária','Sustentabilidade de longo prazo'],['ambiental','Lei ambiental','Proteção e restauração'],['habitacao','Programa habitacional','Moradia e urbanização'],['industria','Incentivo industrial','Inovação e produtividade'],['pec','PEC do pacto federativo','Emenda constitucional · quórum qualificado'],['transporte','Plano nacional de mobilidade','Transporte público e logística'],['energia','Programa de transição energética','Energia e infraestrutura'],['digital','Lei de serviços digitais','Governo digital e proteção de dados'],['saneamento','Marco de saneamento e água','Água tratada e esgoto'],['ciencia','Fundo de ciência e tecnologia','Pesquisa e inovação'],['cultura','Plano nacional de cultura','Patrimônio e produção cultural']];return `<div class="page-head"><div><div class="eyebrow">Agenda legislativa</div><h1>Leis e reformas</h1><p>Crie propostas próprias, configure atributos e leve projetos ao Congresso.</p></div><span class="badge good">${game.politics.lawsPassed.length} leis aprovadas</span></div><div class="card card-pad" style="margin-bottom:15px;border-color:#28624d"><div class="row"><div><div class="card-title" style="margin:0 0 5px">＋ Criar lei do zero <span>Editor sem IA</span></div><p class="muted small" style="margin:0">Escolha área, gastos, impostos, intensidade, prioridade social, dificuldade e prazo. O jogo calcula os efeitos.</p></div><button class="btn btn-primary" data-action="custom-law">Abrir editor</button></div></div><div class="grid grid-2"><div class="card card-pad"><div class="card-title">Propostas prontas <span>Atalhos legislativos</span></div><div class="two-col-list">${presets.map(([id,t,d])=>`<button class="event-choice" data-action="propose" data-type="${id}"><span><b>${t}</b><small>${d}</small></span><span>＋</span></button>`).join('')}</div></div><div class="card card-pad"><div class="card-title">Projetos em tramitação <span>${game.politics.lawsProposed.length}</span></div>${game.politics.lawsProposed.length?game.politics.lawsProposed.map(l=>`<div class="list-item"><div class="row"><b style="font-size:12px">${esc(l.title)}</b><span class="badge warn">Em análise</span></div><p class="muted small">${esc(l.desc)}</p><div class="row"><span class="tiny muted">Custo inicial: ${esc(l.cost)} · Apoio ${esc(l.political)}${l.effect?.annualSpend?` · +R$ ${fmt(l.effect.annualSpend,1)} bi/ano`:''}</span><button class="btn btn-primary btn-sm" data-action="vote-law" data-id="${l.id}" ${game.treasury<(Number(String(l.cost).replace(/[^0-9.,]/g,'').replace(',','.'))||0)?'disabled':''}>Votar</button></div></div>`).join(''):'<div class="empty">Nenhuma proposta em tramitação.</div>'}</div></div><div class="card card-pad" style="margin-top:15px"><div class="card-title">Projetos aguardando sanção presidencial <span>${(game.politics.pendingSanctions||[]).length}</span></div>${(game.politics.pendingSanctions||[]).length?game.politics.pendingSanctions.map(l=>`<div class="list-item row"><div><b style="font-size:12px">${esc(l.title)}</b><div class="muted tiny">${esc(l.result||'Aprovado pelo Congresso')} · ${esc(l.cost)}</div></div><button class="btn btn-primary btn-sm" data-action="president-decision" data-id="${l.id}">Decidir</button></div>`).join(''):'<div class="empty">Nenhum projeto aguardando sanção.</div>'}</div><div class="card card-pad" style="margin-top:15px"><div class="card-title">Legislação aprovada <span>Leis em vigor</span></div>${game.politics.lawsPassed.length?`<div class="table-wrap"><table><thead><tr><th>Lei</th><th>Data</th><th>Resultado</th></tr></thead><tbody>${game.politics.lawsPassed.map(l=>`<tr><td><b>${esc(l.title)}</b><div class="muted tiny">${esc(l.desc)}</div></td><td>${l.date}</td><td><span class="badge good">Sancionada</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">As leis aprovadas aparecerão aqui.</div>'}</div>`;}
function respondToProtest(kind){
 const p=game.politics;
 if((game.unrest||0)<28){toast('Não há mobilização relevante exigindo uma resposta neste momento.');return;}
 if(game.lastProtestResponseMonth===game.monthCount){toast('O governo já respondeu às mobilizações neste mês. Aguarde a próxima rodada.');return;}
 game.lastProtestResponseMonth=game.monthCount;
 if(kind==='dialogue'){game.unrest=clamp((game.unrest||0)-9,0,100);p.stability=clamp(p.stability+1.2,5,95);p.approval=clamp(p.approval+.25,5,92);addNews('Governo abre mesa de diálogo','Representantes de movimentos sociais foram recebidos no Planalto. A tensão diminuiu parcialmente.','🤝','good');}
 if(kind==='rights'){if(game.treasury<8){toast('Caixa insuficiente: são necessários R$ 8 bilhões.');return;}game.treasury-=8;game.unrest=clamp((game.unrest||0)-18,0,100);p.health=clamp(p.health+1.2,5,95);p.approval=clamp(p.approval+.65,5,92);addNews('Pacote de direitos sociais anunciado','O governo destinou R$ 8 bilhões a medidas sociais emergenciais.','✊','good');}
 if(kind==='tax'){game.economy.taxRate=clamp(game.economy.taxRate-0.7,15,35);game.unrest=clamp((game.unrest||0)-12,0,100);p.approval=clamp(p.approval+.45,5,92);addNews('Redução de tributos sobre consumo','O governo reduziu a carga tributária simulada, com impacto futuro na arrecadação.','💸','good');}
 p.rejection=100-p.approval;logDecision('Resposta aos protestos',kind==='dialogue'?'Negociação com lideranças sociais.':kind==='rights'?'Pacote social de R$ 8 bilhões.':'Redução de impostos sobre consumo.');saveGame();render();toast('Resposta registrada. Os indicadores foram atualizados.');
}

e><thead><tr><th>Data</th><th>Aprovação</th><th>Rejeição</th><th>Confiança</th></tr></thead><tbody>${game.polls.map(x=>`<tr><td>${x.date}</td><td class="green">${fmt(x.approval,0)}%</td><td class="red">${fmt(x.rejection,0)}%</td><td>${fmt(x.confidence,0)}%</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">A primeira pesquisa será divulgada após três meses de governo.</div>'}</div></div><div class="stack"><div class="card card-pad"><div class="card-title">Como os grupos avaliam o governo <span>Estimativa do jogo</span></div>${[['Trabalhadores',p.economy*.45+p.health*.2+p.education*.2+p.approval*.15],['Empresariado',p.economy*.55+p.stability*.3+(100-game.economy.taxRate*2)*.15],['Jovens',p.education*.45+p.economy*.2+p.security*.1+p.approval*.25],['População rural',p.economy*.3+p.health*.2+p.stability*.1+p.approval*.4],['Servidores públicos',p.health*.15+p.education*.2+p.stability*.25+p.approval*.4]].map(([n,v])=>`<div style="margin:13px 0"><div class="statline"><span>${n}</span><b>${fmt(clamp(v,0,100),0)}/100</b></div><div class="progress"><i style="width:${clamp(v,0,100)}%"></i></div></div>`).join('')}<p class="footer-note">Indicadores representam segmentos abstratos da população; não são pesquisas reais.</p></div><div class="card card-pad"><div class="card-title">Resposta às reivindicações</div><p class="muted small">Atender às pautas custa dinheiro, mas ignorar mobilizações aumenta a tensão e pode comprometer sua reeleição.</p><div class="stack"><button class="btn btn-secondary btn-sm" data-action="respond-protest" data-kind="dialogue">Abrir negociação com lideranças</button><button class="btn btn-secondary btn-sm" data-action="respond-protest" data-kind="rights">Pacote de direitos sociais (R$ 8 bi)</button><button class="btn btn-secondary btn-sm" data-action="respond-protest" data-kind="tax">Reduzir impostos sobre consumo (custo fiscal)</button></div></div><div class="card card-pad"><div class="card-title">Sinais de mobilização</div><div class="row"><span class="muted small">Risco de protestos</span><span class="badge ${p.approval<35||p.stability<30?'bad':p.approval<48?'warn':'good'}">${p.approval<35||p.stability<30?'Elevado':p.approval<48?'Moderado':'Baixo'}</span></div><div class="row" style="margin-top:10px"><span class="muted small">Risco de greve nacional</span><span class="badge ${p.economy<35?'warn':'good'}">${p.economy<35?'Moderado':'Baixo'}</span></div><div class="row" style="margin-top:10px"><span class="muted small">Confiança institucional</span><b class="small">${p.confidence>=60?'Resiliente':p.confidence>=40?'Instável':'Fragilizada'}</b></div></div></div></div>`;}
function statesPage(){
 let s=game.states.find(x=>x.id===selectedState)||game.states[0],unitLabel=game.regionLabel||'Unidades administrativas';
 return `<div class="page-head"><div><div class="eyebrow">${esc(game.countryName||'País')}</div><h1>Regiões e governos locais</h1><p>Selecione uma unidade administrativa para acompanhar indicadores e direcionar investimentos.</p></div><span class="badge info">${game.states.length} unidades</span></div>
 <div class="split"><div class="card card-pad"><div class="card-title">Mapa administrativo interativo <span>Grade esquemática por região</span></div><div class="state-grid">${game.states.map(st=>`<button class="state-tile ${st.id===selectedState?'selected':''}" data-action="select-state" data-state="${st.id}">${esc(st.id)}<small>${fmt(st.approval,0)}% apoio</small></button>`).join('')}</div><p class="footer-note">Grade para seleção rápida; as posições não representam fronteiras geográficas exatas.</p><div class="divider"></div><div class="grid grid-3"><div><div class="statline"><span>Unidades</span><b>${game.states.length}</b></div></div><div><div class="statline"><span>Organização</span><b>${esc(unitLabel)}</b></div></div><div><div class="statline"><span>Capital</span><b>${esc(game.capital||'—')}</b></div></div></div></div>

 <div class="card card-pad" style="margin-top:15px"><div class="card-title">Comparativo regional <span>Média de desenvolvimento</span></div><div class="grid grid-5">${[...new Set(game.states.map(x=>x.region))].map(r=>{let a=game.states.filter(x=>x.region===r),v=a.reduce((s,x)=>s+x.development,0)/a.length;return `<div><div class="statline"><span>${esc(r)}</span><b>${fmt(v,0)}</b></div><div class="progress"><i style="width:${v}%"></i></div></div>`}).join('')}</div></div>`;

function securityPage(){let s=game.security;return `<div class="page-head"><div><div class="eyebrow">Proteção nacional</div><h1>Segurança e defesa</h1><p>Coordene políticas federais, inteligência e cooperação com estados. O resultado é gradual e depende de orçamento.</p></div><span class="badge info">Comando civil</span></div><div class="grid grid-4" style="margin-bottom:15px">${kpi('Capacidade policial',fmt(s.police,0)+'/100','Polícia Federal e cooperação','🛡')}${kpi('Fronteiras',fmt(s.borders,0)+'/100','Fiscalização e integração','⌖','var(--blue)')}${kpi('Inteligência',fmt(s.intelligence,0)+'/100','Análise e prevenção','◈','var(--purple)')}${kpi('Defesa nacional',fmt(s.defense,0)+'/100','Prontidão e equipamento','✦','var(--yellow)')}</div><div class="split"><div class="card card-pad"><div class="card-title">Prioridades de segurança <span>Escala de investimento 0–100</span></div>${[['police','Policiamento federal e cooperação',s.police],['borders','Segurança nas fronteiras',s.borders],['intelligence','Inteligência e investigação',s.intelligence],['defense','Defesa nacional',s.defense]].map(([k,n,v])=>`<div class="field" style="margin:16px 0"><div class="statline"><label>${n}</label><b>${fmt(v,0)}</b></div><div class="range-row"><input type="range" data-security="${k}" min="10" max="100" value="${v}" step="1"/><b style="min-width:36px">${fmt(v,0)}</b></div></div>`).join('')}<button class="btn btn-primary" data-action="apply-security">Aplicar prioridades</button><p class="footer-note">Ajustar prioridades não altera o dinheiro sozinho; o orçamento anual de segurança e defesa também precisa sustentar as capacidades.</p></div><div class="stack"><div class="card card-pad"><div class="card-title">Ações estratégicas</div><button class="event-choice" data-action="security-action" data-type="crime"><span><b>🔎 Operação integrada contra crime organizado</b><small>R$ 4 bi · fortalece inteligência e cooperação</small></span><span>›</span></button><button class="event-choice" data-action="security-action" data-type="border"><span><b>🛰️ Plano de proteção de fronteiras</b><small>R$ 3 bi · melhora fiscalização</small></span><span>›</span></button><button class="event-choice" data-action="security-action" data-type="cyber"><span><b>💻 Proteção de infraestrutura crítica</b><small>R$ 2 bi · melhora resiliência digital</small></span><span>›</span></button></div><div class="card card-pad"><div class="card-title">Indicadores de segurança</div><div class="statline"><span>Satisfação pública</span><b>${fmt(game.politics.security,0)}/100</b></div><div class="progress"><i style="width:${game.politics.security}%"></i></div><div class="statline" style="margin-top:12px"><span>Pressão do crime organizado</span><b>${fmt(s.organizedCrime,0)}/100</b></div><div class="progress bad"><i style="width:${s.organizedCrime}%"></i></div><div class="footer-note">Quanto maior a pressão do crime, maiores os efeitos negativos sobre estabilidade e atividade econômica.</div></div></div></div>`;}
function diplomacyPage(){let c=game.countries.find(x=>x.id===selectedCountry)||game.countries[0];return `<div class="page-head"><div><div class="eyebrow">Política externa</div><h1>Relações internacionais</h1><p>Construa parcerias, negocie acordos e equilibre interesses comerciais e estratégicos.</p></div><span class="badge info">${game.diplomaticAgreements.length} acordos celebrados</span></div><div class="split"><div class="card card-pad"><div class="card-title">Painel diplomático <span>Países estratégicos</span></div><div class="stack">${game.countries.map(x=>`<button class="event-choice" style="margin:0" data-action="select-country" data-country="${x.id}"><span class="row" style="justify-content:flex-start"><b style="font-size:22px">${x.flag}</b><span><b>${x.name}</b><small>${x.stance} · Relação ${fmt(x.relation,0)}/100</small></span></span><span class="badge ${x.relation>=65?'good':x.relation<35?'bad':'info'}">${x.relation>=65?'Próxima':x.relation<35?'Tensa':'Neutra'}</span></button>`).join('')}</div></div><div class="card card-pad"><div class="card-title">${c.flag} ${esc(c.name)} <span>${c.id}</span></div><div class="muted small">${esc(c.leader)}</div><div class="grid grid-2" style="margin:15px 0">${kpi('Relação bilateral',fmt(c.relation,0)+'/100','Confiança diplomática','🤝')}${kpi('Poder econômico',fmt(c.economy,0)+'/100','Índice relativo','↗','var(--blue)')}${kpi('Poder militar',fmt(c.military,0)+'/100','Índice relativo','🛡','var(--yellow)')}${kpi('Comércio potencial',fmt(c.trade,0)+' bi','Índice comercial','🚢','var(--purple)')}</div><div class="stack"><button class="btn btn-primary" data-action="diplomacy" data-type="agreement" data-country="${c.id}" ${game.treasury<1.5?'disabled':''}>🤝 Negociar acordo comercial (R$ 1,5 bi)</button><button class="btn btn-secondary" data-action="diplomacy" data-type="visit" data-country="${c.id}" ${game.treasury<.8?'disabled':''}>✈️ Realizar visita diplomática (R$ 0,8 bi)</button><button class="btn btn-danger" data-action="diplomacy" data-type="sanction" data-country="${c.id}">⚠️ Aplicar medidas restritivas</button></div><p class="footer-note">Relações diplomáticas afetam comércio, atração de investimentos e influência internacional. Sanções têm custo reputacional e comercial.</p></div></div><div class="card card-pad" style="margin-top:15px"><div class="card-title">Acordos e tratados <span>Histórico da gestão</span></div>${game.diplomaticAgreements.length?game.diplomaticAgreements.slice().reverse().map(a=>`<div class="list-item row"><div><b style="font-size:11px">${esc(a.type)} — ${esc(a.country)}</b><div class="muted tiny">${a.date}</div></div><span class="badge good">Concluído</span></div>`).join(''):'<div class="empty">Nenhum acordo foi registrado ainda.</div>'}</div>`;}
function newsPage(){return `<div class="page-head"><div><div class="eyebrow">Agência Brasil 2027 · Edição de governo</div><h1>Notícias e acontecimentos</h1><p>O jornal reflete decisões, indicadores e eventos da sua própria partida.</p></div><span class="badge info">${game.news.length} registros</span></div><div class="split"><div class="card card-pad"><div class="card-title">Jornal nacional <span>Mais recentes primeiro</span></div>${game.news.length?game.news.map(n=>`<div class="news-item"><div class="news-icon">${n.icon}</div><div><div class="row" style="align-items:flex-start"><b>${esc(n.title)}</b><span class="badge ${n.impact==='good'?'good':n.impact==='bad'?'bad':n.impact==='warn'?'warn':'info'}">${n.impact==='good'?'Positivo':n.impact==='bad'?'Negativo':n.impact==='warn'?'Atenção':'Governo'}</span></div><p>${esc(n.desc)}</p><time>${dateLabel(n.date)}</time></div></div>`).join(''):'<div class="empty">As notícias serão geradas conforme você governa e avança o calendário.</div>'}</div><div class="stack"><div class="card card-pad"><div class="card-title">Crises enfrentadas <span>${game.events.length}</span></div>${game.events.length?game.events.map(ev=>`<div class="list-item"><b style="font-size:11px">${esc(ev.title)}</b><div class="muted tiny">${ev.date} · Resposta: ${esc(ev.choice)}</div></div>`).join(''):'<div class="empty">Nenhuma crise resolvida até agora.</div>'}</div><div class="card card-pad"><div class="card-title">Linha do tempo</div>${game.decisions.slice(0,9).map(d=>`<div class="list-item"><div class="muted tiny">${d.date}</div><b style="font-size:11px">${esc(d.title)}</b></div>`).join('')||'<div class="empty">Sem decisões registradas.</div>'}</div></div></div>`;}
function getProfiles(){try{return JSON.parse(localStorage.getItem(PROFILES_KEY)||'[]')}catch(e){return[]}}
function setProfiles(){localStorage.setItem(PROFILES_KEY,JSON.stringify(profiles));}
function hashPass(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16);}
function currentProfile(){return profiles.find(p=>p.username===activeProfile)||null;}
function playersPage(){profiles=getProfiles();let me=currentProfile(),myRequests=me?.requests||[],friends=me?.friends||[];return `<div class="page-head"><div><div class="eyebrow">Modo competitivo local</div><h1>Disputa contra amigo</h1><p>Crie seu presidente 2D, adicione outro perfil e dispute uma eleição em 15 rodadas de debate.</p></div><span class="badge info">${me?'Perfil conectado':'Sem perfil ativo'}</span></div><div class="split"><div class="stack"><div class="card card-pad"><div class="card-title">Seu perfil de jogador <span>Armazenado neste navegador</span></div>${me?`<div class="row" style="justify-content:flex-start"><div class="profile-art">${me.avatar}</div><div><b style="font-size:15px">${esc(me.displayName)}</b><div class="muted small">@${esc(me.username)}</div><div class="tag" style="margin-top:6px">Presidente fictício</div></div></div><div class="row" style="margin-top:14px"><button class="btn btn-secondary btn-sm" data-action="logout-profile">Sair do perfil</button><button class="btn btn-ghost btn-sm" data-action="switch-profile">Trocar perfil</button></div>`:`<p>Crie uma identidade local para participar das disputas. Para aceitar o pedido, seu amigo também precisará criar/entrar no perfil neste mesmo navegador.</p><button class="btn btn-primary" data-action="create-profile">Criar meu perfil</button>${profiles.length?'<button class="btn btn-secondary" style="margin-top:8px" data-action="switch-profile">Entrar em perfil existente</button>':''}`}</div>${me?`<div class="card card-pad"><div class="card-title">Adicionar amigo <span>Pedido por username</span></div><div class="field"><label>Username do amigo</label><input id="friendUsername" placeholder="ex.: presidente_amigo" maxlength="22"/></div><button class="btn btn-primary" style="margin-top:12px" data-action="send-request">Enviar pedido de amizade</button><p class="footer-note">Os perfis precisam existir neste navegador. Para jogar pela internet em aparelhos diferentes, será necessário um servidor de contas e sincronização.</p></div><div class="card card-pad"><div class="card-title">Pedidos recebidos <span>${myRequests.length}</span></div>${myRequests.length?myRequests.map(u=>`<div class="row list-item"><b>@${esc(u)}</b><button class="btn btn-primary btn-sm" data-action="accept-request" data-user="${esc(u)}">Aceitar</button></div>`).join(''):'<div class="empty">Nenhum pedido recebido.</div>'}</div>`:''}</div><div class="stack"><div class="card card-pad"><div class="card-title">Seus amigos <span>${friends.length}</span></div>${friends.length?friends.map(u=>{let f=profiles.find(x=>x.username===u);return `<div class="row list-item"><div class="row" style="justify-content:flex-start"><div class="avatar">${f?.avatar||'👤'}</div><div><b style="font-size:12px">${esc(f?.displayName||u)}</b><div class="muted tiny">@${esc(u)}</div></div></div><span class="badge good">Amigo</span></div>`}).join(''):'<div class="empty">Adicione um amigo para liberar o convite de disputa.</div>'}</div><div class="card card-pad"><div class="card-title">Como funciona o debate</div><div class="stack"><div class="row"><span class="muted small">Rodadas de perguntas</span><b>15</b></div><div class="row"><span class="muted small">Opções por resposta</span><b>5</b></div><div class="row"><span class="muted small">Eleição</span><b>Após o debate</b></div><div class="row"><span class="muted small">Mandato do vencedor</span><b>4 anos</b></div><div class="divider"></div><p class="muted small">Cada fala altera a percepção dos eleitores por temas como economia, saúde, estabilidade, liberdade, meio ambiente e influência mundial. O perdedor assume a liderança de um país rival no modo carreira local.</p></div></div><div class="card card-pad"><div class="card-title">Disputas disponíveis</div>${me&&friends.length?friends.map(u=>`<div class="row list-item"><div><b style="font-size:12px">Contra @${esc(u)}</b><div class="muted tiny">Debate presidencial 2027</div></div><button class="btn btn-primary btn-sm" data-action="invite-duel" data-user="${esc(u)}">Convidar</button></div>`).join(''):'<div class="empty">Depois de aceitar um pedido, o botão de convite aparecerá aqui.</div>'}</div></div></div>`;}
function historyPage(){let h=[];try{h=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch(e){}return `<div class="page-head"><div><div class="eyebrow">Arquivo nacional</div><h1>Histórico de governos</h1><p>Compare os mandatos encerrados neste navegador.</p></div><span class="badge info">${h.length} governos registrados</span></div><div class="card card-pad">${h.length?`<div class="table-wrap"><table><thead><tr><th>Presidente</th><th>Partido</th><th>Data final</th><th>Nota</th><th>Aprovação</th><th>PIB final</th><th>Leis</th></tr></thead><tbody>${h.map(x=>`<tr><td><b>${esc(x.president)}</b></td><td>${esc(x.party)}</td><td>${x.date}</td><td><span class="badge ${x.score>=70?'good':x.score<45?'bad':'info'}">${fmt(x.score,1)}/100</span></td><td>${fmt(x.approval,0)}%</td><td>R$ ${fmt(x.gdp,2)} tri</td><td>${x.laws}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Quando um mandato for concluído, seu relatório será guardado aqui.</div>'}</div>`;}
function settingsPage(){let level=game.difficultyLevel||3;return `<div class="page-head"><div><div class="eyebrow">Preferências e dados</div><h1>Configurações</h1><p>Gerencie sua partida e seus arquivos de salvamento.</p></div></div><div class="grid grid-2"><div class="card card-pad"><div class="card-title">Salvamento</div><div class="row"><div><b style="font-size:12px">Salvamento automático</b><div class="muted tiny">Grava após decisões e passagem do tempo.</div></div><input type="checkbox" id="autoSave" ${game.settings.autoSave?'checked':''} style="accent-color:var(--green);width:18px;height:18px"/></div><div class="divider"></div><div class="stack"><button class="btn btn-primary" data-action="save">Salvar agora</button><button class="btn btn-secondary" data-action="export">Exportar partida (.json)</button><button class="btn btn-secondary" data-action="import">Carregar partida (.json)</button><button class="btn btn-danger" data-action="reset-save">Apagar salvamento local</button></div></div><div class="card card-pad"><div class="card-title">Informações da simulação</div><div class="list-item row"><span class="muted small">Versão do jogo</span><b class="small">1.4</b></div><div class="list-item row"><span class="muted small">Data de início</span><b class="small">Janeiro de 2027</b></div><div class="list-item row"><span class="muted small">Duração do mandato</span><b class="small">48 meses</b></div><div class="list-item row"><span class="muted small">Armazenamento</span><b class="small">Local + online opcional</b></div><div class="footer-note">Indicadores e personagens são fictícios; o modelo não substitui análise jurídica ou econômica.</div></div><div class="card card-pad"><div class="card-title">Dificuldade atual <span>${level}/5</span></div><div class="statline"><span>Nível</span><b id="newDifficultyLabel">${['','Muito fácil','Fácil','Normal','Difícil','Muito difícil'][level]}</b></div><input id="newDifficultyLevel" type="range" min="1" max="5" step="1" value="${level}"/><button class="btn btn-secondary btn-sm" style="margin-top:12px" data-action="save-difficulty">Aplicar dificuldade</button></div><div class="card card-pad"><div class="card-title">Encerrar sessão</div><p class="muted small">Volte ao menu principal. Sua partida permanece salva neste navegador.</p><button class="btn btn-ghost" data-action="main-menu">Voltar ao menu principal</button></div></div>`;}
function renderMenu(){let has=!!localStorage.getItem(SAVE_KEY);$('#app').innerHTML=`<div class="menu-layout"><div class="menu-logo"><div class="flag"></div><h1>BRASIL 2027</h1><p>SIMULADOR DE PRESIDENTE · CONSTRUA SEU GOVERNO</p></div><div class="hero"><div class="eyebrow">A república está em suas mãos</div><h2>Governe. Negocie. Decida. Enfrente as consequências.</h2><p>Assuma a Presidência da República em janeiro de 2027. Administre a economia, monte seu gabinete, negocie com o Congresso e construa o legado do seu governo.</p></div><div class="card menu-card" style="margin-top:15px"><div class="row"><div><b style="font-size:16px">Menu principal</b><div class="muted small">Escolha como deseja começar.</div></div><span class="badge info">Versão 1.5</span></div><div class="menu-actions"><button class="btn btn-primary" data-action="new-game">🇧🇷 Nova presidência</button><button class="btn btn-secondary" data-action="menu-online">🌐 Modo online — X1 / Coop / Amigos</button><button class="btn btn-secondary" data-action="menu-duel">⚔️ Disputa local contra amigo</button><button class="btn btn-secondary" data-action="menu-account">👤 Criar perfil / Entrar</button><button class="btn btn-secondary" data-action="continue" ${has?'':'disabled'}>▶ Continuar jogo</button><button class="btn btn-secondary" data-action="load-file">📂 Carregar partida</button><button class="btn btn-ghost" data-action="menu-history">◷ Histórico de governos</button><button class="btn btn-ghost" data-action="menu-settings">⚙️ Configurações</button></div><p class="footer-note">Jogo de estratégia política com cenário fictício. O progresso é salvo localmente no navegador. Países jogáveis: Brasil, Estados Unidos, Argentina e Espanha.</p></div><div class="footer-note" style="text-align:center">🇧🇷 República Federativa do Brasil · Simulação iniciada em 01/01/2027</div></div>`;}
function startConfig(){openModal('Novo governo',`<p>Defina a identidade do seu governo. Você começará em 1º de janeiro de 2027, com um mandato de quatro anos.</p><div class="form-grid"><div class="field"><label>País para governar</label><select id="cfgCountry"><option value="BRA">🇧🇷 Brasil</option><option value="USA">🇺🇸 Estados Unidos</option><option value="ARG">🇦🇷 Argentina</option><option value="ESP">🇪🇸 Espanha</option></select></div><div class="field"><label id="cfgExecutiveLabel">Nome do chefe do Executivo</label><input id="cfgPresident" maxlength="40" value="Alexandre Silva"/></div><div class="field"><label>Nome do partido / coalizão</label><input id="cfgParty" maxlength="32" value="Movimento Brasil Unido"/></div><div class="field"><label>Ideologia política</label><select id="cfgIdeology"><option>Centro</option><option>Centro-esquerda</option><option>Centro-direita</option><option>Progressista</option><option>Conservador</option><option>Liberal</option><option>Trabalhista</option><option>Ambientalista</option><option>Desenvolvimentista</option><option>Independente</option></select></div><div class="field"><label>Situação inicial do país</label><select id="cfgScenario"><option value="regular">Regular — desafios moderados</option><option value="favoravel">Favorável — economia aquecida</option><option value="crise">Crise — inflação e desemprego elevados</option></select></div></div><div class="field" style="margin-top:14px"><div class="statline"><label>Dificuldade</label><b id="cfgDifficultyLabel">Normal</b></div><input id="cfgDifficultyLevel" type="range" min="1" max="5" step="1" value="3"/><div class="row muted tiny"><span>Muito fácil</span><span>Normal</span><span>Muito difícil</span></div></div><div class="field"><label>Proposta central do governo</label><input id="cfgPromise" maxlength="90" value="Modernizar serviços públicos e ampliar oportunidades"/></div><div class="footer-note">A dificuldade altera a situação inicial, frequência de eventos, volatilidade e function startGame(){let level=clamp(Number($('#cfgDifficultyLevel')?.value||3),1,5),difficulty=level<=2?'easy':level>=4?'hard':'normal';let cfg={president:$('#cfgPresident').value.trim()||'Presidente da República',party:$('#cfgParty').value.trim()||'Partido Independente',ideology:$('#cfgIdeology').value,difficulty,difficultyLevel:level,scenario:$('#cfgScenario').value,countryId:$('#cfgCountry')?.value||'BRA'};game=freshGame(cfg);game.unrest=game.unrest??18;game.protests=game.protests||[];let identity=currentProfile();if(identity){game.president=identity.displayName+' — '+game.president;game.profileUsername=identity.username;}game.proposal.promise=$('#cfgPromise').value.trim()||game.proposal.promise;game.proposal.completion=0;addNews('Novo governo toma posse',`${game.president} iniciou o mandato em ${game.capital}, à frente de ${game.countryName}, com a organização política ${game.party}.` ,game.countryFlag||'🏛️','good');addNews('Gabinete ministerial empossado','Os 16 ministérios iniciam o trabalho com a equipe escolhida para a nova administração.','🏛️','neutral');logDecision('Início do mandato',`${game.countryName} · ${game.governmentSystem} · ${game.legislatureName}; organização ${game.party}; dificuldade ${level}/5.`);saveGame();closeModal();page='home';render();toast('Governo iniciado. Bom mandato!');}
function accountModal(){profiles=getProfiles();let rows=profiles.map(p=>`<div class="row list-item"><div><b>${esc(p.displayName)}</b><div class="muted tiny">@${esc(p.username)}</div></div><button class="btn btn-primary btn-sm" data-action="login-profile" data-user="${esc(p.username)}">Entrar</button></div>`).join('');openModal('Perfil de jogador',`<p>Seu perfil identifica você nas disputas. As contas são locais a este navegador.</p>${rows||'<div class="empty">Nenhum perfil criado ainda.</div>'}<div class="divider"></div><button class="btn btn-secondary" data-action="create-profile">＋ Criar novo perfil</button>`,`<button class="btn btn-ghost" data-action="close-modal">Fechar</button>`);}

function createProfileModal(){openModal('Criar perfil de jogador',`<p>Escolha como os outros jogadores verão seu presidente fictício. Este perfil fica salvo apenas neste navegador.</p><div class="form-grid"><div class="field"><label>Como te chamam?</label><input id="profileName" maxlength="30" placeholder="Seu nome de jogo"/></div><div class="field"><label>Username</label><input id="profileUser" maxlength="22" placeholder="sem espaços"/></div><div class="field"><label>Senha local</label><input id="profilePass" type="password" minlength="4" placeholder="mínimo 4 caracteres"/></div><div class="field"><label>Avatar</label><div class="avatar-picks">${avatarOptions.map((a,i)=>`<button class="avatar-pick ${i===0?'selected':''}" data-action="pick-avatar" data-avatar="${i}">${a}</button>`).join('')}</div></div></div><div class="footer-note">Aviso: é um modo local de demonstração, não uma conta online. A senha é transformada em um código simples no navegador e não oferece segurança de serviço real. Não use uma senha pessoal.</div>`,`<button class="btn btn-ghost" data-action="close-modal">Cancelar</button><button class="btn btn-primary" data-action="save-profile">Criar perfil</button>`);$('#modalRoot').dataset.avatar='0';}
function createProfile(){let name=$('#profileName').value.trim(),user=$('#profileUser').value.trim().toLowerCase(),pass=$('#profilePass').value;if(!name||!user||pass.length<4){toast('Preencha nome, username e senha com pelo menos 4 caracteres.');return;}if(!/^[a-z0-9_]+$/.test(user)){toast('Username: use apenas letras, números e _.');return;}profiles=getProfiles();if(profiles.some(p=>p.username===user)){toast('Esse username já existe neste navegador.');return;}profiles.push({displayName:name,username:user,passwordHash:hashPass(pass),avatar:avatarOptions[Number($('#modalRoot').dataset.avatar||0)],friends:[],requests:[],sent:[]});setProfiles();activeProfile=user;localStorage.setItem(ACTIVE_KEY,user);closeModal();render();toast('Perfil criado! Agora adicione seu amigo.');}
function sendFriendRequest(){let u=$('#friendUsername')?.value.trim().toLowerCase();profiles=getProfiles();let me=currentProfile();if(!u||!me){toast('Digite um username válido.');return;}let target=profiles.find(p=>p.username===u);if(!target){toast('Esse perfil ainda não existe neste navegador.');return;}if(u===me.username||me.friends.includes(u)){toast('Esse perfil já é você ou já está na sua lista.');return;}if(target.requests.includes(me.username)){toast('O pedido já foi enviado.');return;}target.requests.push(me.username);me.sent=me.sent||[];me.sent.push(u);setProfiles();render();toast('Pedido enviado para @'+u+'.');}
function acceptRequest(u){profiles=getProfiles();let me=currentProfile(),other=profiles.find(p=>p.username===u);if(!me||!other)return;me.requests=me.requests.filter(x=>x!==u);if(!me.friends.includes(u))me.friends.push(u);if(!other.friends.includes(me.username))other.friends.push(me.username);other.sent=(other.sent||[]).filter(x=>x!==me.username);setProfiles();render();toast('@'+u+' agora é seu amigo.');}
