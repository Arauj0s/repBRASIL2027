let duel=null;
function inviteDuel(u){profiles=getProfiles();let me=currentProfile(),other=profiles.find(p=>p.username===u);if(!me||!other||!me.friends.includes(u)){toast('Você precisa ter um amigo aceito para convidar.');return;}duel={players:[{username:me.username,name:me.displayName,avatar:me.avatar,score:0,answers:[]},{username:other.username,name:other.displayName,avatar:other.avatar,score:0,answers:[]}],round:0,turn:0,questionOrder:[...Array(15)].map((_,i)=>i),lastWinner:null};openModal('Convite para debate',`<p>Você está convidando <b>@${esc(u)}</b> para uma eleição presidencial de 2027. Como o jogo está em modo local, os dois jogadores respondem alternadamente no mesmo navegador.</p><div class="row"><div class="profile-art">${me.avatar}</div><div style="text-align:center">VS</div><div class="profile-art">${other.avatar}</div></div>`,`<button class="btn btn-ghost" data-action="close-modal">Cancelar</button><button class="btn btn-primary" data-action="start-duel">Iniciar debate →</button>`);}
function startDuel(){closeModal();showDebate();}
function showDebate(){let q=debateQuestions[duel.round],player=duel.players[duel.turn];openModal(`Debate presidencial · ${duel.round+1}/15`,`<div class="row" style="justify-content:flex-start"><div class="profile-art" style="width:58px;height:66px;font-size:30px">${player.avatar}</div><div><b>${esc(player.name)}</b><div class="muted small">Vez de responder · @${esc(player.username)}</div><span class="badge info">${q.topic}</span></div></div><h3 style="font-size:16px;line-height:1.4;margin:18px 0">${q.q}</h3><p>Escolha a fala que representa sua proposta. A resposta altera sua pontuação de percepção pública.</p>${q.opts.map((o,i)=>`<button class="event-choice" data-action="debate-answer" data-option="${i}"><span><b>${esc(o[0])}</b></span><span>›</span></button>`).join('')}`);}
function answerDebate(i){let q=debateQuestions[duel.round],p=duel.players[duel.turn],choice=q.opts[i];p.score+=choice[1]+rand(-1,1);p.answers.push({topic:q.topic,text:choice[0],score:choice[1]});if(duel.turn===0){duel.turn=1;showDebate();}else{duel.turn=0;duel.round++;if(duel.round<15)showDebate();else finishDuel();}}
function finishDuel(){let [a,b]=duel.players;let winner=a.score===b.score?pick([a,b]):a.score>b.score?a:b;duel.lastWinner=winner.username;let loser=winner.username===a.username?b:a;openModal('Resultado da eleição',`<div style="text-align:center"><div class="profile-art" style="margin:10px auto">${winner.avatar}</div><div class="eyebrow">Presidente eleito</div><h2>${esc(winner.name)}</h2><div class="report-score">${winner.score} pts</div><p>${esc(loser.name)} ficou em segundo lugar com ${loser.score} pontos e assumirá o governo de uma nação rival fictícia.</p></div><div class="grid grid-2"><div class="card card-pad"><b>${esc(a.name)}</b><div class="muted small">${a.score} pontos</div></div><div class="card card-pad"><b>${esc(b.name)}</b><div class="muted small">${b.score} pontos</div></div></div>`,`<button class="btn btn-primary" data-action="duel-career">Começar carreira →</button>`);}
function startDuelCareer(){let w=duel.players.find(p=>p.username===duel.lastWinner),l=duel.players.find(p=>p.username!==duel.lastWinner);let rival=pick([{name:'República Argentina',flag:'🇦🇷'},{name:'Reino Unido',flag:'🇬🇧'},{name:'República do Chile',flag:'🇨🇱'},{name:'República da Colômbia',flag:'🇨🇴'},{name:'República da África do Sul',flag:'🇿🇦'}]);closeModal();game=freshGame({president:w.name,party:'Aliança da Vitória',ideology:'Independente',scenario:'regular'});game.president=w.name;game.proposal.promise='Executar as propostas defendidas durante o debate presidencial';game.duel={winner:w.username,loser:l.username,rivalCountry:rival.name,rivalFlag:rival.flag,opponent:l.name,score:w.score,opponentScore:l.score};addNews('Eleição presidencial concluída',`${w.name} venceu o debate eleitoral e assumiu a Presidência do Brasil. ${l.name} passa a liderar ${rival.name}, nação rival da campanha.`,'🗳️','good');logDecision('Eleição contra amigo','Vitória no debate presidencial; rival: '+rival.name+'.');saveGame();page='home';render();toast('Carreira iniciada após o debate!');}
function showReport(){let s=performanceScore(),items=[['Economia',s.economy],['Saúde pública',s.health],['Estabilidade',s.stability],['Poder de compra',s.purchasing],['Exército e defesa',s.army],['Aprovação popular',s.approval],['Crises administradas',s.crises],['Paz interna',s.wars],['Influência mundial',s.influence],['Proposta inicial cumprida',s.promise]];openModal('Relatório final do governo',`<div class="row"><div><div class="eyebrow">Avaliação da mídia</div><h2>${esc(game.president)}</h2><div class="muted small">${esc(game.party)} · Mandato concluído em ${todayISO()}</div></div><div class="report-score">${fmt(s.total,1)}</div></div><p>Nota consolidada de desempenho com base nos critérios do cenário.</p><div class="stack">${items.map(([n,v])=>`<div><div class="statline"><span>${n}</span><b>${fmt(v,0)}/100${n.includes('Proposta')?' ('+fmt(game.proposal.completion,0)+'%)':''}</b></div><div class="progress"><i style="width:${clamp(v,0,100)}%"></i></div></div>`).join('')}</div><div class="divider"></div><div class="grid grid-2"><div><div class="muted tiny">Crescimento do PIB desde o início</div><b>${fmt((game.economy.gdp/game.initialMetrics.gdp-1)*100,1)}%</b></div><div><div class="muted tiny">Evolução da inflação</div><b>${fmt(game.initialMetrics.inflation,1)}% → ${fmt(game.economy.inflation,1)}%</b></div><div><div class="muted tiny">Evolução do desemprego</div><b>${fmt(game.initialMetrics.unemployment,1)}% → ${fmt(game.economy.unemployment,1)}%</b></div><div><div class="muted tiny">Dívida pública</div><b>${fmt(game.initialMetrics.debt,1)}% → ${fmt(game.economy.debt,1)}%</b></div><div><div class="muted tiny">Leis aprovadas</div><b>${game.politics.lawsPassed.length}</b></div><div><div class="muted tiny">Investimentos estaduais</div><b>${game.investments.length}</b></div></div><p class="footer-note">A nota da mídia é uma fórmula de jogo, não uma avaliação política real. A proposta pode ultrapassar 100% quando políticas correlatas geram entregas adicionais.</p>`,`<button class="btn btn-ghost" data-action="close-modal">Fechar</button>${game.election?.status==='completed'?'':'<button class="btn btn-secondary" data-action="successor">Apoiar sucessor</button><button class="btn btn-primary" data-action="reelection" '+(game.election?.reelection?'':'disabled')+'>Disputar reeleição</button>'}<button class="btn btn-ghost" data-action="post-term">Pós-mandato</button>`);}
function electionChoice(choice){
 if(!game.election||game.election.status!=='campaign'){toast('Não há eleição em andamento.');return;}
 const mandateCount=game.termMandates||1;
 if(choice==='reelection'&&mandateCount>=2){toast('A Constituição do cenário permite apenas uma reeleição consecutiva.');return;}
 const p=game.politics;
 const difficultyMod=([4,2,0,-2,-4][(game.difficultyLevel||3)-1]||0);
 const electoralScore=clamp(p.approval*.42+p.stability*.18+p.economy*.16+p.congressMood*.10+(100-(game.unrest||0))*.08+(100-game.economy.unemployment*4)*.06+difficultyMod+(Math.random()-.5)*12,0,100);
 const threshold=([48,50,53,55,58][(game.difficultyLevel||3)-1]||53);
 const won=electoralScore>=threshold;
 game.election={...game.election,status:'completed',date:`${game.election.year}-10-06`,approval:p.approval,score:electoralScore,result:won?'vitória':'derrota',choice};
 if(choice==='reelection'){
   saveHistory();
   addNews('Resultado das eleições presidenciais de '+game.election.year,won?`${game.president} venceu a eleição simulada e foi reeleito para um segundo e último mandato consecutivo.`:`${game.president} perdeu a eleição simulada. A oposição conquistou a Presidência.`, '🗳️',won?'good':'bad');
   logDecision('Eleições presidenciais '+game.election.year,won?'Reeleição confirmada.':'Derrota eleitoral.');
   if(won){game.termMandates=2;game.termStartYear=game.date.month>=9?game.date.year+1:game.date.year;game.termMonths=game.monthCount+(game.date.month===0?0:12-game.date.month)+48;game.ended=false;game.continueAfterTerm=false;game.election.nextTermStart=game.termStartYear;}
   else{game.ended=true;game.termMonths=game.monthCount;saveHistory();}
 }else{
   const successor=pick(['Marina Albuquerque','Rafael Nogueira','Camila Duarte','Eduardo Sampaio','Lívia Monteiro']);
   game.election.successor=successor;
   addNews('Resultado das eleições presidenciais de '+game.election.year,won?`${successor}, apoiado pela coalizão governista, venceu a eleição. O grupo mantém a Presidência, mas um novo governo assumirá.`:`A coalizão governista não conseguiu eleger seu sucessor. A oposição venceu a eleição.`, '🗳️',won?'good':'bad');
   logDecision('Apoio a sucessor',won?`${successor} eleito. O mandato do jogador termina.`:'Candidato da coalizão derrotado.');
   game.ended=true;game.termMonths=game.monthCount;saveHistory();
 }
 saveGame();closeModal();render();if(!game.ended)showNextQueuedEvent();toast(choice==='reelection'?(won?'Reeleição confirmada!':'Derrota eleitoral simulada.'):(won?'Sucessor eleito.':'A oposição venceu.'));
}
function postTerm(){
 const previous=game.president;
 const nextPresident=game.election?.successor||pick(['Marina Albuquerque','Rafael Nogueira','Camila Duarte','Eduardo Sampaio','Lívia Monteiro']);
 const nextYear=game.election?.year?game.election.year+1:(game.date.month>=9?game.date.year+1:game.date.year);
 game.president=nextPresident;game.termStartYear=nextYear;game.termMandates=1;
 game.termMonths=game.monthCount+(game.date.month===0?0:12-game.date.month)+48;
 game.ended=false;game.continueAfterTerm=true;game.election=null;
 addNews('Novo governo inicia o período pós-mandato',`${nextPresident} assume a simulação após o encerramento do governo de ${previous}. O limite constitucional de reeleição passa a contar novamente para este novo presidente.`,'🏛️','neutral');
 saveGame();closeModal();render();toast('Simulação continuada com um novo presidente.');
}
function doEconAction(type){let cost={infrastructure:8,incentive:5,social:6}[type];if(game.treasury<cost){toast('Caixa insuficiente.');return;}game.treasury-=cost;if(type==='infrastructure'){game.economy.growth+=.18;game.budget.categories.infraestrutura+=5;game.proposal.completion+=3;addNews('Plano de infraestrutura anunciado','R$ 8 bi foram reservados para obras logísticas e mobilidade.','🏗️','good');}if(type==='incentive'){game.economy.growth+=.12;game.economy.exports+=3;game.proposal.completion+=2;addNews('Indústria recebe pacote de incentivo','R$ 5 bi em crédito e inovação foram anunciados.','🏭','good');}if(type==='social'){game.politics.approval=clamp(game.politics.approval+0.8,5,92);game.economy.growth+=.06;game.proposal.completion+=2;addNews('Programa de estímulo à renda','R$ 6 bi foram destinados a iniciativas de renda e consumo.','🛒','good');}game.politics.rejection=100-game.politics.approval;logDecision('Ação econômica',type);saveGame();render();toast('Programa implementado.');}
function applyEconomy(){if(game.lastEconPolicyMonth===game.monthCount){toast('A política econômica já foi revista neste mês. Aguarde o próximo fechamento mensal.');return;}let range=$('#taxRange'),wage=Number($('#minWage').value),priority=$('#econPriority').value;const wageBase=game.economy.wageReference||game.economy.minimumWage||1621;if(wage<wageBase*.8||wage>wageBase*3.1||!Number.isFinite(wage)){toast('Salário mínimo fora da faixa permitida para esta moeda.');return;}let old=game.economy.taxRate,oldWage=game.economy.minimumWage;game.economy.taxRate=Number(range.value);game.economy.minimumWage=wage;if(priority==='growth')game.economy.growth+=.08;if(priority==='stability')game.economy.inflation=Math.max(.2,game.economy.inflation-.06);if(priority==='industry'){game.economy.exports+=.8;game.economy.growth+=.04;}if(priority==='social')game.politics.health=clamp(game.politics.health+.25,5,92);game.lastEconPolicyMonth=game.monthCount;game.politics.rejection=100-game.politics.approval;addNews('Governo altera diretriz econômica',`Alíquota média ajustada de ${fmt(old,1)}% para ${fmt(game.economy.taxRate,1)}%. Salário mínimo definido em ${game.currencySymbol||'R$'} ${wage.toLocaleString('pt-BR')}; prioridade: ${priority}.`,'📊','neutral');logDecision('Política econômica atualizada','Tributos '+fmt(old,1)+'% → '+fmt(game.economy.taxRate,1)+'%; salário mínimo '+(game.currencySymbol||'R$')+' '+wage+' (antes '+(game.currencySymbol||'R$')+' '+oldWage+').');saveGame();render();toast('Diretrizes econômicas aplicadas.');}
function applyBudget(){let changed={};$$('[data-budget]').forEach(el=>changed[el.dataset.budget]=Number(el.value));let total=Object.values(changed).reduce((a,b)=>a+b,0);if(total>4500){toast('Orçamento anual acima do teto de R$ 4.500 bi. Reduza despesas.');return;}let old=game.budget.categories;game.budget.categories=changed;let delta=total-Object.values(old).reduce((a,b)=>a+b,0);addNews('Orçamento federal redistribuído',`A despesa anual planejada passou a R$ ${fmt(total,0)} bi (${delta>=0?'+':''}${fmt(delta,0)} bi).`,'▤','neutral');logDecision('Redistribuição do orçamento','Novo total de despesas: R$ '+fmt(total,1)+' bi/ano.');saveGame();render();toast('Distribuição orçamentária salva.');}
function applySecurity(){let changes={};$$('[data-security]').forEach(el=>changes[el.dataset.security]=Number(el.value));let cost=Object.entries(changes).reduce((s,[k,v])=>s+Math.max(0,v-game.security[k])*.08,0);if(game.treasury<cost){toast('Caixa insuficiente para financiar essa expansão de capacidade.');return;}game.treasury-=cost;Object.assign(game.security,changes);addNews('Prioridades de segurança atualizadas',`O governo redistribuiu investimentos em polícia, fronteiras, inteligência e defesa. Custo inicial: R$ ${fmt(cost,1)} bi.`,'🛡️','neutral');logDecision('Prioridades de segurança alteradas','Custo de implantação R$ '+fmt(cost,1)+' bi.');saveGame();render();toast('Prioridades de segurança atualizadas.');}
function securityAction(type){let cfg={crime:[4,'organização policial','security'],border:[3,'segurança de fronteiras','borders'],cyber:[2,'proteção cibernética','intelligence']}[type];if(game.treasury<cfg[0]){toast('Caixa insuficiente.');return;}game.treasury-=cfg[0];if(type==='crime'){game.security.intelligence=clamp(game.security.intelligence+6,0,100);game.security.organizedCrime=clamp(game.security.organizedCrime-5,0,100);}else if(type==='border'){game.security.borders=clamp(game.security.borders+8,0,100);}else game.security.intelligence=clamp(game.security.intelligence+5,0,100);game.politics.security=clamp(game.politics.security+2,0,100);addNews('Ação estratégica de segurança concluída',`O governo investiu R$ ${cfg[0]} bi em ${cfg[1]}.`,'🛡️','good');logDecision('Programa de segurança',cfg[1]);saveGame();render();toast('Ação estratégica concluída.');}

function createCustomLaw(){let v=lawSliderValues();if(!v.title){toast('Dê um nome ao projeto.');return;}let f=lawFocusInfo(v.focus),scale=v.intensity/100,initial=Math.round(v.spend*(.12+scale/5)*10)/10,effect={cash:-initial,budgetCategory:f.budget,annualSpend:v.spend,taxChange:v.tax,complexity:v.complexity,priority:v.priority,implementationMonths:v.months};let mag=scale*(.3+v.priority/140);if(f.metric==='health')effect.health=+(v.intensity*.055*mag).toFixed(2);if(f.metric==='education')effect.education=+(v.intensity*.055*mag).toFixed(2);if(f.metric==='security')effect.security=+(v.intensity*.05*mag).toFixed(2);if(f.metric==='environment')effect.environment=+(v.intensity*.06*mag).toFixed(2);if(f.metric==='growth')effect.growth=+(v.intensity*.004*mag).toFixed(3);if(v.focus==='industry')effect.exports=+(v.intensity*.025*mag).toFixed(2);if(v.focus==='infrastructure')effect.states=+(v.intensity*.045*mag).toFixed(2);if(v.focus==='government')effect.revenue=+(v.intensity*.025*mag).toFixed(2);if(v.focus==='social')effect.approval=+(v.intensity*.045*(v.priority/100)).toFixed(2);effect.approval=(effect.approval||0)+(v.priority-50)*.025-(v.complexity-3)*.55-Math.max(0,v.tax)*.45+Math.max(0,-v.tax)*.22;let political=v.complexity>=4||v.spend>=50||Math.abs(v.tax)>=2?'Alto':v.complexity<=2&&v.spend<20?'Baixo':'Médio';let desc=`Projeto de ${f.name}, intensidade ${v.intensity}/100, prioridade social ${v.priority}/100, prazo ${v.months} meses e dificuldade de execução ${v.complexity}/5. Efeitos calculados por regras internas.`;let l=newProposal(v.title,desc,`R$ ${fmt(initial,1)} bi`,v.spend?`Despesa permanente de R$ ${fmt(v.spend,1)} bi/ano`:'Sem despesa anual adicional',political,effect,false);l.custom=true;game.politics.lawsProposed.push(l);addNews('Novo projeto de lei protocolado',`${v.title} foi enviado ao Congresso. Custo inicial ${moneyFmt(initial)}; despesa anual adicional ${moneyFmt(v.spend)}.`,'📜','neutral');logDecision('Projeto de lei criado: '+v.title,desc);saveGame();closeModal();render();toast('Projeto criado e enviado ao Congresso.');}

function fiscalOperation(title,amount,note){
 game.assets.operations.unshift({title,amount,note,date:todayISO(),monthCount:game.monthCount});
 game.assets.operations=game.assets.operations.slice(0,40);
 logDecision(title,`${moneyFmt(amount)} · ${note}`);
}
function assetSale(id,pct){
 const c=game.assets.companies.find(x=>x.id===id);
 if(!c||!Number.isFinite(pct)||pct<=0||pct>100||c.share<pct){toast('Participação pública insuficiente.');return;}
 const amount=c.value*pct/100*.90;
 const dividendLoss=c.annualDividend*pct/100;
 c.share-=pct;
 game.economy.revenueAnnual=Math.max(0,game.economy.revenueAnnual-dividendLoss);
 game.treasury+=amount;
 game.politics.approval=clamp(game.politics.approval-(pct>=25?2.0:.7),5,92);
 game.politics.rejection=100-game.politics.approval;
 game.politics.stability=clamp(game.politics.stability-(pct>=50?2:0.6),5,92);
 fiscalOperation('Venda de participação estatal',amount,`${c.name}: ${fmt(pct,0)}% vendidos; dividendos anuais caem ${moneyFmt(dividendLoss)}.`);
 addNews('Venda de participação estatal',`O governo vendeu ${fmt(pct,0)}% da participação na ${c.name}, arrecadando ${moneyFmt(amount)}. A receita anual de dividendos foi reduzida em ${moneyFmt(dividendLoss)}.`,'🏢','warn');
 saveGame();render();toast('Receita incorporada ao caixa.');
}
function treasuryAction(type){
 const a=game.assets,f=game.financing,e=game.economy,p=game.politics;
 const within12=arr=>arr.filter(x=>game.monthCount-(x.monthCount??game.monthCount)<12).length;
 if(type==='property'){
  if(a.propertiesValue<5){toast('Não há patrimônio disponível suficiente para outro leilão.');return;}
  a.propertiesValue-=5;game.treasury+=5;fiscalOperation('Leilão de imóveis públicos',5,'Venda de ativos imobiliários não estratégicos.');addNews('Leilão de imóveis públicos',`Ativos não estratégicos foram leiloados por ${moneyFmt(5)}.`,'🏛️','warn');
 }else if(type==='concession'){
  if(a.concessions.length>=3){toast('O limite de concessões deste mandato foi atingido.');return;}
  const amount=4;a.concessions.push({date:todayISO(),monthCount:game.monthCount,amount});game.treasury+=amount;fiscalOperation('Concessão de infraestrutura',amount,'Outorga recebida; operação transferida conforme contrato.');e.growth=clamp(e.growth+.05,-8,9);addNews('Concessão de infraestrutura',`A outorga gerou ${moneyFmt(amount)} e o contrato prevê investimentos privados e obrigações de serviço.`,'🛣️','good');
 }else if(type==='bonds'){
  if(within12(f.bonds)>=2){toast('Limite de duas emissões nos últimos 12 meses atingido.');return;}
  const amount=15;game.treasury+=amount;e.debt=clamp(e.debt+amount/(e.gdp*10),10,180);e.interest=clamp(e.interest+.12,3,30);
  f.bonds.push({date:todayISO(),monthCount:game.monthCount,amount});fiscalOperation('Emissão de títulos públicos',amount,'Captação com aumento da dívida e custo financeiro.');addNews('Tesouro emite títulos públicos',`Captação de ${moneyFmt(amount)} reforça o caixa e eleva dívida e custo futuro dos juros.`,'📄','warn');
 }else if(type==='loan'){
  if(within12(f.loans)>=1){toast('Já existe um empréstimo emergencial nos últimos 12 meses.');return;}
  const amount=20;game.treasury+=amount;e.debt=clamp(e.debt+amount/(e.gdp*10),10,180);e.interest=clamp(e.interest+.22,3,30);
  f.loans.push({date:todayISO(),monthCount:game.monthCount,amount});fiscalOperation('Empréstimo emergencial',amount,'Crédito emergencial com juros e vencimentos futuros.');addNews('Empréstimo emergencial contratado',`O governo recebeu ${moneyFmt(amount)}, assumindo juros e obrigações futuras.`,'🤝','warn');
 }else if(type==='renegotiate'){
  if(f.renegotiations.length>=3){toast('Limite de renegociações emergenciais atingido.');return;}
  const amount=6;game.treasury+=amount;e.debt=clamp(e.debt+.08,10,180);e.interest=clamp(e.interest+.08,3,30);
  f.renegotiations.push({date:todayISO(),monthCount:game.monthCount,amount});fiscalOperation('Renegociação da dívida',amount,'Pagamento de curto prazo adiado; encargos futuros ligeiramente maiores.');addNews('Acordo de renegociação da dívida',`O governo obteve alívio imediato de ${moneyFmt(amount)}, com alongamento de obrigações e pequeno aumento dos encargos futuros.`,'🔄','warn');
 }else if(type==='recovery'){
  if(f.recoveryPlans>=2){toast('Os dois planos de recuperação fiscal deste mandato já foram aplicados.');return;}
  const before=game.budget.categories.administracao||0;const saving=before*.12;
  if(before<=0){toast('Não há despesa administrativa ajustável.');return;}
  game.budget.categories.administracao=before-saving;f.recoveryPlans++;

 }
 saveGame();render();toast('Operação fiscal registrada. Os indicadores foram atualizados.');
}

function impeachmentAction(stage){
 const im=game.impeachment,p=game.politics,r=game.impeachmentRules||{};
 const add=(title,detail)=>im.history.push({title,detail,date:todayISO()});
 const pressure=clamp((50-p.approval)*.005+(50-p.stability)*.004+(game.unrest-40)*.003+(50-partySupport())*.004,0,.78);
 if(game.procedureType==='censure'){
  if(stage!=='motion')return;
  if(!['none','censure-rejected','replaced'].includes(im.status)){toast('Já existe uma moção em andamento.');return;}
  if(im.lastFiledMonth>-90&&game.monthCount-im.lastFiledMonth<6){toast('Aguarde seis meses antes de apresentar outra moção.');return;}
  const hs=game.houseSeats||350,signNeed=r.censureSignatures||Math.ceil(hs/10),voteNeed=r.censureVotes||Math.floor(hs/2)+1;
  const signatures=Math.round(hs*clamp(.16+pressure*.55,.05,.95));im.votes.censureSignatures=signatures;im.lastFiledMonth=game.monthCount;
  if(signatures<signNeed){
   im.status='censure-rejected';im.votes.censureYes=0;add('Moção não alcança assinaturas',`${signatures}/${hs} assinaturas; eram necessárias ${signNeed}.`);
   addNews('Moção de censura não é apresentada','O número mínimo de assinaturas não foi alcançado no cenário.','🏛️','neutral');
  }else{
   const yes=Math.round(hs*clamp(.30+pressure*.72,.05,.96));im.votes.censureYes=yes;
   if(yes>=voteNeed){
    im.status='censure-approved';game.president='Presidente do Governo — candidato alternativo';game.party='Coalizão parlamentar alternativa';
    p.stability=clamp(p.stability-3,5,92);p.approval=clamp(p.approval-1,5,92);p.rejection=100-p.approval;p.congressMood=clamp(p.congressMood+3,5,95);
    add('Moção de censura aprovada',`${signatures} assinaturas; ${yes}/${hs} votos favoráveis, mínimo ${voteNeed}. O Governo foi substituído na simulação.`);
    addNews('Moção de censura aprovada','O Congresso aprovou uma moção construtiva e substituiu o Governo na simulação.','🏛️','warn');
   }else{
    im.status='censure-rejected';p.congressMood=clamp(p.congressMood-2,5,95);
    add('Moção de censura rejeitada',`${signatures} assinaturas; ${yes}/${hs} votos favoráveis, mínimo ${voteNeed}.`);
    addNews('Moção de censura rejeitada','O Governo permanece em funções na simulação.','🏛️','neutral');
   }
  }
  saveGame();render();toast(im.status==='censure-approved'?'Moção aprovada: Governo substituído.':'Resultado da moção registrado.');return;
 }
 const hs=game.houseSeats||513,ss=game.senateSeats||81,house=game.chamberName||'Câmara',senate=game.senateName||'Senado';
 const houseNeed=r.house||Math.ceil(hs*2/3),openNeed=r.senateOpen||0,trialNeed=r.senateConviction||Math.ceil(ss*2/3);
 if(stage==='petition'){
  if(!['none','rejected-house','rejected-senate','acquitted'].includes(im.status)){toast('Já existe um processo em andamento.');return;}
  if(im.lastFiledMonth>-90&&game.monthCount-im.lastFiledMonth<6){toast('Aguarde seis meses antes de protocolar outra denúncia.');return;}
  im.status='petition';im.lastFiledMonth=game.monthCount;add('Denúncia protocolada',`Pedido fictício encaminhado à ${house}.`);
  addNews('Denúncia protocolada','Uma acusação fictícia foi apresentada para análise legislativa.','⚖️','bad');
 }else if(stage==='house'){
  if(im.status!=='petition')return;
  const yes=Math.round(hs*clamp(.30+pressure*.72,.03,.96));im.votes.houseYes=yes;im.votes.houseRequired=houseNeed;
  if(yes>=houseNeed){im.status='house-approved';p.stability=clamp(p.stability-4,5,92);add(`${house} autoriza a etapa seguinte`,`${yes}/${hs} votos favoráveis; mínimo ${houseNeed}.`);addNews('Câmara legislativa aprova a acusação','A votação atingiu o quórum definido para esta simulação.','🏛️','bad');}
  else{im.status='rejected-house';p.congressMood=clamp(p.congressMood+1,5,95);add(`${house} rejeita a acusação`,`${yes}/${hs} votos favoráveis; eram necessários ${houseNeed}.`);addNews('Acusação rejeitada na câmara','O quórum da simulação não foi alcançado.','🏛️','neutral');}
 }else if(stage==='senate-open'){
  if(im.status!=='house-approved')return;
  if(!openNeed){im.status='senate-opened';add(`Caso encaminhado ao julgamento no ${senate}`,'A etapa intermediária foi omitida nesta versão simplificada.');addNews('Caso encaminhado ao julgamento','O procedimento avançou para a votação final no Senado.','⚖️','warn');}
  else{
   const yes=Math.round(ss*clamp(.28+pressure*.74,.03,.96));im.votes.senateOpenYes=yes;im.votes.senateOpenRequired=openNeed;
   if(yes>=openNeed){im.status='senate-opened';p.stability=clamp(p.stability-5,5,92);p.approval=clamp(p.approval-1.5,5,92);p.rejection=100-p.approval;add(`${senate} abre o julgamento`,`${yes}/${ss} votos favoráveis; mínimo ${openNeed}.`);addNews('Julgamento encaminhado ao Senado','A votação atingiu o quórum de abertura desta simulação.','⚖️','bad');}
   else{im.status='rejected-senate';add(`${senate} recusa a abertura`,`${yes}/${ss} votos; eram necessários ${openNeed}.`);addNews('Abertura do processo recusada','O quórum de abertura não foi alcançado na simulação.','⚖️','warn');}
  }
 }else if(stage==='trial'){
  if(im.status!=='senate-opened')return;
  const yes=Math.round(ss*clamp(.26+pressure*.76,.03,.96));im.votes.senateTrialYes=yes;im.votes.senateTrialRequired=trialNeed;
  if(yes>=trialNeed){im.status='removed';game.ended=true;game.continueAfterTerm=false;p.stability=clamp(p.stability-14,5,92);add(`${senate} condena e encerra o mandato`,`${yes}/${ss} votos favoráveis; mínimo ${trialNeed}.`);addNews('Mandato encerrado após julgamento','A condenação alcançou o quórum de votação da simulação.','⚖️','bad');try{saveHistory();}catch(err){}}
  else{im.status='acquitted';p.stability=clamp(p.stability-3,5,92);p.approval=clamp(p.approval+1,5,92);p.rejection=100-p.approval;add(`${senate} não alcança os votos para condenação`,`${yes}/${ss} votos favoráveis; eram necessários ${trialNeed}.`);addNews('Julgamento termina sem condenação','O quórum de condenação não foi alcançado na simulação.','⚖️','warn');}
 }
 saveGame();render();toast('Etapa do procedimento registrada.');
}

async function onlineRegister(){try{if(!onlineInit())throw new Error('Configure o backend primeiro.');let email=$('#onlineEmail')?.value.trim(),password=$('#onlinePass')?.value,user=$('#onlineUsername')?.value.trim().toLowerCase(),name=$('#onlineName')?.value.trim(),avatar=avatarOptions[Number($('#onlineAvatar')?.value||0)]||'👤';if(!email||!password||password.length<8||!user||!name)throw new Error('Preencha os campos; a senha precisa ter 8 caracteres.');if(!/^[a-z0-9_]{3,22}$/.test(user))throw new Error('Username deve ter 3–22 caracteres: letras, números ou _.');let q=await onlineClient.auth.signUp({email,password,options:{data:{username:user,display_name:name,avatar}}});if(q.error)throw q.error;if(q.data.session){let p=await onlineClient.from('brasil2027_profiles').upsert({id:q.data.user.id,username:user,display_name:name,avatar},{onConflict:'id'});if(p.error)throw p.error;await onlineAuthRefresh();await onlineRefreshData();render();toast('Conta online criada!');}else toast('Conta criada. Confirme o e-mail e depois entre.');}catch(e){toast('Cadastro: '+e.message);}}

async function onlineRefreshData(){if(!onlineUser)return;let uid=onlineUser.id;let r=await onlineClient.from('brasil2027_friendships').select('*').or(`requester_id.eq.${uid},addressee_id.eq.${uid}`);if(r.error)throw r.error;let ids=[...new Set((r.data||[]).flatMap(x=>[x.requester_id,x.addressee_id]).filter(x=>x!==uid))],profiles=[];if(ids.length){let p=await onlineClient.from('brasil2027_profiles').select('*').in('id',ids);if(p.error)throw p.error;profiles=p.data||[];}onlineFriends=(r.data||[]).filter(x=>x.status==='accepted').map(x=>({...x,person:profiles.find(p=>p.id===(x.requester_id===uid?x.addressee_id:x.requester_id))}));onlineIncoming=(r.data||[]).filter(x=>x.status==='pending'&&x.addressee_id===uid).map(x=>({...x,person:profiles.find(p=>p.id===x.requester_id)}));onlineOutgoing=(r.data||[]).filter(x=>x.status==='pending'&&x.requester_id===uid).map(x=>({...x,person:profiles.find(p=>p.id===x.addressee_id)}));let a=await onlineClient.from('brasil2027_rooms').select('*').eq('guest_id',uid).eq('status','waiting').order('created_at',{ascending:false});if(a.error)throw a.error;onlineInvites=a.data||[];let b=await onlineClient.from('brasil2027_rooms').select('*').or(`host_id.eq.${uid},guest_id.eq.${uid}`).order('created_at',{ascending:false}).limit(10);if(b.error)throw b.error;onlineRooms=b.data||[];}
async function onlineAddFriend(){
 try{
  if(!onlineUser)throw new Error('Entre primeiro.');
  const username=$('#onlineFriend')?.value.trim().toLowerCase();if(!username)throw new Error('Digite o username.');
  const profile=await onlineClient.from('brasil2027_profiles').select('id,username').eq('username',username).maybeSingle();
  if(profile.error)throw profile.error;if(!profile.data)throw new Error('Username não encontrado.');
  if(profile.data.id===onlineUser.id)throw new Error('Esse é seu próprio perfil.');
  const uid=onlineUser.id,target=profile.data.id;
  const [outgoing,incoming]=await Promise.all([
   onlineClient.from('brasil2027_friendships').select('*').eq('requester_id',uid).eq('addressee_id',target).limit(1),
   onlineClient.from('brasil2027_friendships').select('*').eq('requester_id',target).eq('addressee_id',uid).limit(1)
  ]);
  if(outgoing.error)throw outgoing.error;if(incoming.error)throw incoming.error;
  const row=[...(outgoing.data||[]),...(incoming.data||[])].find(x=>x.status==='accepted'||x.status==='pending');
  if(row){if(row.status==='accepted')throw new Error('Vocês já são amigos.');if(row.requester_id===target&&row.addressee_id===uid){await onlineAccept(row.id);toast('Pedido recebido anteriormente — amizade aceita!');return;}throw new Error('Pedido já enviado; aguardando resposta.');}
  const inserted=await onlineClient.from('brasil2027_friendships').insert({requester_id:uid,addressee_id:target,status:'pending'});
  if(inserted.error)throw inserted.error;
  await onlineRefreshData();render();toast('Pedido enviado! A outra sessão será atualizada se estiver online.');
 }catch(e){toast('Amigos: '+e.message);}
}

function onlineRoomCode(){return Math.random().toString(36).slice(2,8).toUpperCase();}
async function onlineCreate(mode,friendId=null){try{if(!onlineUser)throw new Error('Entre na conta online.');if(!game){game=freshGame({});saveGame();}let row={code:onlineRoomCode(),mode,host_id:onlineUser.id,guest_id:friendId,status:'waiting',shared_state:mode==='coop'?game:null,host_state:mode==='duel'?game:null,guest_state:null,last_actor_id:onlineUser.id};let q=await onlineClient.from('brasil2027_rooms').insert(row).select('*').single();if(q.error)throw q.error;onlineRoom=q.data;localStorage.setItem('brasil2027_room_id',onlineRoom.id);await onlineWatchRoom();await onlineRefreshData();render();toast('Sala criada. Compartilhe o código!');}catch(e){toast('Criar sala: '+e.message);}}
async function onlineJoin(idOrCode){try{if(!onlineUser)throw new Error('Entre na conta online.');let q;if(/^[0-9a-f-]{30,}$/i.test(idOrCode))q=await onlineClient.from('brasil2027_rooms').select('*').eq('id',idOrCode).maybeSingle();else q=await onlineClient.from('brasil2027_rooms').select('*').eq('code',idOrCode.trim().toUpperCase()).eq('status','waiting').maybeSingle();if(q.error)throw q.error;let r=q.data;if(!r)throw new Error('Sala não encontrada.');if(r.host_id!==onlineUser.id){if(r.guest_id&&r.guest_id!==onlineUser.id)throw new Error('Sala reservada a outro jogador.');let update={guest_id:onlineUser.id,status:'active',last_actor_id:onlineUser.id};if(r.mode==='duel')update.guest_state=game||freshGame({});let u=await onlineClient.from('brasil2027_rooms').update(update).eq('id',r.id).select('*').single();if(u.error)throw u.error;r=u.data;}onlineRoom=r;if(r.mode==='coop'&&r.shared_state){game=migrateGame(r.shared_state);saveLocalOnly();}else if(r.mode==='duel'){let other=r.host_id===onlineUser.id?r.guest_state:r.host_state;onlineOpponentSnapshot=other||null;if(!game)game=freshGame({});}localStorage.setItem('brasil2027_room_id',r.id);await onlineWatchRoom();await onlineRefreshData();render();toast(r.mode==='coop'?'Você entrou no governo cooperativo.':'Você entrou no X1 presidencial.');}catch(e){toast('Entrar na sala: '+e.message);}}
async function onlineWatchFriendships(){
 if(!onlineClient||!onlineUser)return;
 if(onlineFriendChannel)await onlineClient.removeChannel(onlineFriendChannel);
 const uid=onlineUser.id;
 onlineFriendChannel=onlineClient.channel('brasil2027-friends-'+uid)
  .on('postgres_changes',{event:'*',schema:'public',table:'brasil2027_friendships'},payload=>{
   const row=payload.new||payload.old;
   if(!row||![row.requester_id,row.addressee_id].includes(uid))return;
   const newIncoming=payload.eventType==='INSERT'&&row.addressee_id===uid&&row.status==='pending';
   onlineRefreshData().then(()=>{if(page==='online')render();if(newIncoming)toast('🔔 Novo pedido de amizade recebido!');})
    .catch(e=>console.warn('Atualização de amizades:',e.message));
  })
  .subscribe((status,error)=>{
   if(status==='SUBSCRIBED')console.info('Realtime de amizades conectado.');
   if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')console.warn('Realtime de amizades indisponível:',error?.message||status);
  });
}

async function onlineWatchRoom(){if(!onlineClient||!onlineRoom)return;if(onlineChannel)await onlineClient.removeChannel(onlineChannel);let id=onlineRoom.id;onlineChannel=onlineClient.channel('brasil2027-'+id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'brasil2027_rooms',filter:`id=eq.${id}`},payload=>{let r=payload.new;if(!r)return;onlineRoom=r;if(r.mode==='coop'&&r.last_actor_id!==onlineUser?.id&&r.shared_state){game=migrateGame(r.shared_state);saveLocalOnly();render();}else if(r.mode==='duel'){onlineOpponentSnapshot=r.host_id===onlineUser?.id?r.guest_state:r.host_state;if(page==='online')render();}}).subscribe();}
function saveLocalOnly(){try{if(game)localStorage.setItem(SAVE_KEY,JSON.stringify(game));}catch(e){}}
async function onlineSync(){if(!onlineClient||!onlineUser||!onlineRoom||!game)return;let payload={last_actor_id:onlineUser.id,updated_at:new Date().toISOString()};if(onlineRoom.mode==='coop')payload.shared_state=game;else if(onlineRoom.host_id===onlineUser.id)payload.host_state=game;else payload.guest_state=game;let q=await onlineClient.from('brasil2027_rooms').update(payload).eq('id',onlineRoom.id);if(q.error)console.warn('Falha de sync:',q.error.message);}
function onlineLeave(){if(onlineChannel&&onlineClient)onlineClient.removeChannel(onlineChannel);onlineChannel=null;onlineRoom=null;onlineOpponentSnapshot=null;localStorage.removeItem('brasil2027_room_id');render();toast('Você saiu da sala; seu salvamento local continua.');}
function onlinePage(){let c=onlineCfg(),ready=!!(c.url&&c.key),r=onlineRoom,opp=r?.mode==='duel'?(r.host_id===onlineUser?.id?r.guest_state:r.host_state):onlineOpponentSnapshot;return `<div class="page-head"><div><div class="eyebrow">Multiplayer pela internet</div><h1>Modo online</h1><p>X1 presidencial, governo cooperativo e amigos em um menu só.</p></div><span class="badge ${onlineUser?'good':'warn'}">${onlineUser?'Conectado':'Desconectado'}</span></div>${!ready?`<div class="card card-pad" style="margin-bottom:15px"><div class="card-title">Conectar backend <span>Configuração única por navegador</span></div><p class="muted small">Crie um projeto gratuito no Supabase, execute o arquivo BRASIL_2027_online_setup.sql no SQL Editor e cole aqui a URL e a chave anon/public.</p><div class="form-grid"><div class="field"><label>Project URL</label><input id="onlineUrl" placeholder="https://seuprojeto.supabase.co"/></div><div class="field"><label>Chave anon/public</label><input id="onlineAnon" placeholder="eyJ..."/></div></div><button class="btn btn-primary" data-action="online-save-config">Salvar conexão</button></div>`:`<div class="card card-pad" style="margin-bottom:15px"><div class="row"><div><b>Backend Supabase configurado</b><div class="muted tiny">${esc(c.url)}</div></div><button class="btn btn-secondary btn-sm" data-action="online-edit">Editar</button></div></div>`}${!onlineUser?`<div class="card card-pad"><div class="card-title">Conta online</div><div class="form-grid"><div class="field"><label>E-mail</label><input id="onlineEmail" type="email" placeholder="voce@email.com"/></div><div class="field"><label>Senha (8+ caracteres)</label><input id="onlinePass" type="password"/></div><div class="field"><label>Username público (cadastro)</label><input id="onlineUsername" maxlength="22" placeholder="presidente_2027"/></div><div class="field"><label>Nome de exibição (cadastro)</label><input id="onlineName" maxlength="30" placeholder="Seu nome de jogo"/></div><div class="field"><label>Avatar (cadastro)</label><select id="onlineAvatar">${avatarOptions.map((a,i)=>`<option value="${i}">${a}</option>`).join('')}</select></div></div><div class="row" style="justify-content:flex-start"><button class="btn btn-secondary" data-action="online-register">Criar conta</button><button class="btn btn-primary" data-action="online-login">Entrar</button></div><p class="footer-note">Use uma senha exclusiva. A autenticação ocorre no Supabase; o jogo não guarda a senha.</p></div>`:`<div class="grid grid-2"><div class="card card-pad"><div class="card-title">Seu perfil online</div><b>${esc(onlineProfile?.display_name||onlineUser.email)}</b><div class="muted tiny">@${esc(onlineProfile?.username||'')}</div><button class="btn btn-ghost btn-sm" style="margin-top:12px" data-action="online-logout">Sair da conta</button></div><div class="card card-pad"><div class="card-title">Começar partida</div><div class="grid grid-2"><button class="btn btn-primary" data-action="online-new-x1">⚔️ Criar sala X1</button><button class="btn btn-secondary" data-action="online-new-coop">🤝 Criar sala Coop</button></div><div class="field" style="margin-top:12px"><label>Código da sala</label><div class="row"><input id="onlineCode" maxlength="6" placeholder="ABC123"/><button class="btn btn-secondary" data-action="online-join-code">Entrar</button></div></div></div><div class="card card-pad"><div class="card-title">Amigos online <span>${onlineFriends.length}</span></div><div class="row"><input id="onlineFriend" placeholder="username do amigo" maxlength="22"/><button class="btn btn-secondary" data-action="online-add-friend">Adicionar</button></div>${onlineFriends.map(x=>`<div class="row list-item"><div><b>${esc(x.person?.display_name||'Jogador')}</b><div class="muted tiny">@${esc(x.person?.username||'')}</div></div><button class="btn btn-primary btn-sm" data-action="online-invite" data-user="${x.person?.id||''}">Convidar</button></div>`).join('')||'<div class="empty">Nenhum amigo adicionado.</div>'}</div><div class="card card-pad"><div class="card-title">Pedidos recebidos <span>${onlineIncoming.length}</span></div>${onlineIncoming.map(x=>`<div class="row list-item"><b>@${esc(x.person?.username||'jogador')}</b><button class="btn btn-primary btn-sm" data-action="online-accept" data-id="${x.id}">Aceitar</button></div>`).join('')||'<div class="empty">Nenhum pedido pendente.</div>'}</div><div class="card card-pad"><div class="card-title">Pedidos enviados <span>${onlineOutgoing.length}</span></div>${onlineOutgoing.map(x=>`<div class="row list-item"><span>@${esc(x.person?.username||'jogador')}</span><span class="badge warn">Aguardando</span></div>`).join('')||'<div class="empty">Nenhum pedido enviado pendente.</div>'}</div><div class="card card-pad"><div class="card-title">Convites recebidos <span>${onlineInvites.length}</span></div>${onlineInvites.map(x=>`<div class="row list-item"><b>${x.mode==='duel'?'X1':'Coop'} · ${x.code}</b><button class="btn btn-primary btn-sm" data-action="online-open" data-id="${x.id}">Aceitar</button></div>`).join('')||'<div class="empty">Nenhum convite.</div>'}</div><div class="card card-pad"><div class="card-title">Suas salas recentes <span>${onlineRooms.length}</span></div>${onlineRooms.map(x=>`<div class="row list-item"><div><b>${x.mode==='duel'?'X1':'Coop'} · ${x.code}</b><div class="muted tiny">${x.status==='active'?'Ativa':'Aguardando jogador'}</div></div><button class="btn btn-secondary btn-sm" data-action="online-open" data-id="${x.id}">Abrir</button></div>`).join('')||'<div class="empty">Nenhuma sala criada.</div>'}</div></div>`}${r?`<div class="card card-pad" style="margin-top:15px;border-color:#28624d"><div class="row"><div><div class="eyebrow">Sala atual</div><h2 style="margin:0">${r.mode==='duel'?'⚔️ X1 presidencial':'🤝 Governo cooperativo'} · ${r.code}</h2><p class="muted small">${r.status==='active'?'Dois participantes na sala.':'Aguardando o outro presidente.'}</p></div><button class="btn btn-ghost" data-action="online-leave">Sair da sala</button></div>${r.mode==='duel'&&opp?`<div class="grid grid-3"><div class="card card-pad"><div class="muted tiny">Presidente adversário</div><b>${esc(opp.president||'Jogador')}</b></div><div class="card card-pad"><div class="muted tiny">Aprovação</div><b>${fmt(opp.politics?.approval||0,0)}%</b></div><div class="card card-pad"><div class="muted tiny">PIB</div><b>${esc(onlineRoom?.mode==='duel'?'':(game?.currencySymbol||'R$'))} ${fmt(opp.economy?.gdp||0,2)} tri</b></div></div>`:''}<p class="footer-note">${r.mode==='coop'?'Coop compartilha o mesmo governo. Evitem salvar decisões simultaneamente; a última gravação pode prevalecer.':'No X1 cada presidente mantém seu próprio país e acompanha indicadores do rival.'}</p></div>`:''}`;}

function importFile(){ $('#importFile').click(); }
function exportFile(){let blob=new Blob([JSON.stringify(game,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='BRASIL_2027_partida.json';a.click();URL.revokeObjectURL(url);toast('Arquivo de partida exportado.');}
function bindGlobal(){document.addEventListener('click',e=>{let pg=e.target.closest('[data-page]');if(pg){e.preventDefault();go(pg.dataset.page);return;}let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action;switch(a){case'toggle-menu':$('#sidebar')?.classList.toggle('open');break;case'close-modal':closeModal();break;case'new-game':startConfig();break;case'menu-account':accountModal();break;case'menu-online':page='online';if(!game)game=freshGame({});render();go('online');break;case'login-profile':loginProfile(el.dataset.user);break;case'confirm-new-game':startGame();break;case'continue':if(loadGame()){page='home';if(beginElectionCampaign())saveGame();render();if(game.election?.status==='campaign')showElectionModal();else showNextQueuedEvent();toast('Partida recuperada.');}else toast('Nenhuma partida salva.');break;case'load-file':importFile();break;case'menu-history':page='history';renderMenuHistory();break;case'menu-settings':if(loadGame()){page='settings';render();}else openModal('Configurações','<p>Comece uma presidência para acessar as configurações da partida. Você poderá exportar e importar salvamentos e controlar o salvamento automático.</p>');break;case'save':saveGame(true);break;case'advance':advanceDays(Number(el.dataset.days));break;case'advance-month':advanceMonths(1);break;case'calendar-go':advanceToDate($('#calendarTarget')?.value);break;case'show-event':showEventModal();break;case'respond-protest':respondToProtest(el.dataset.kind);break;case'event-choice':chooseEvent(Number(el.dataset.index));break;case'apply-economy':applyEconomy();break;case'econ-action':doEconAction(el.dataset.type);break;case'apply-budget':applyBudget();break;case'online-save-config':onlineSaveConfig();break;case'online-register':onlineRegister();break;case'online-login':onlineLogin();break;case'online-logout':onlineLogout();break;case'online-add-friend':onlineAddFriend();break;case'online-accept':onlineAccept(el.dataset.id);break;case'online-new-x1':onlineCreate('duel');break;case'online-new-coop':onlineCreate('coop');break;case'online-join-code':onlineJoin($('#onlineCode')?.value||'');break;case'online-open':onlineJoin(el.dataset.id);break;case'online-invite':onlineCreate('duel',el.dataset.user);break;case'online-leave':onlineLeave();break;case'online-edit':openModal('Editar backend',`<div class="field"><label>Project URL</label><input id="onlineUrl" value="${esc(onlineCfg().url||'')}"/></div><div class="field"><label>Chave anon/public</label><input id="onlineAnon" value="${esc(onlineCfg().key||'')}"/></div>`,`<button class="btn btn-primary" data-action="online-save-config">Salvar</button>`);break;case'asset-sale':assetSale(el.dataset.id,Number(el.dataset.pct));break;case'asset-property':treasuryAction('property');break;case'asset-concession':treasuryAction('concession');break;case'issue-bonds':treasuryAction('bonds');break;case'emergency-loan':treasuryAction('loan');break;case'renegotiate-debt':treasuryAction('renegotiate');break;case'recovery-plan':treasuryAction('recovery');break;case'impeach-motion':impeachmentAction('motion');case'impeach-petition':impeachmentAction('petition');break;case'impeach-house':impeachmentAction('house');break;case'impeach-senate-open':impeachmentAction('senate-open');break;case'impeach-trial':impeachmentAction('trial');break;case'appoint':appointMinister(el.dataset.ministry);break;case'choose-minister':chooseMinister(el.dataset.ministry,Number(el.dataset.candidate));break;case'dismiss':dismissMinister(el.dataset.ministry);break;case'negotiate':negotiate(el.dataset.party);break;case'negotiate-choice':resolveNegotiation(el.dataset.party,el.dataset.kind);break;case'resolve-vote':resolveLawVote(el.dataset.id,el.dataset.approach);break;case'propose':proposeLaw(el.dataset.type);break;case'custom-law':customLawModal();break;case'create-custom-law':createCustomLaw();break;case'vote-law':voteLaw(el.dataset.id);break;case'president-decision':showSanctionModal(el.dataset.id);break;case'sanction-law':sanctionLaw(el.dataset.id);break;case'veto-law':vetoLaw(el.dataset.id);break;case'select-state':selectedState=el.dataset.state;render();break;case'invest-state':investState(el.dataset.state);break;case'apply-security':applySecurity();break;case'security-action':securityAction(el.dataset.type);break;case'select-country':selectedCountry=el.dataset.country;render();break;case'diplomacy':diplomacy(el.dataset.type,el.dataset.country);break;case'create-profile':createProfileModal();break;case'pick-avatar':$$('.avatar-pick').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');$('#modalRoot').dataset.avatar=el.dataset.avatar;break;case'save-profile':createProfile();break;case'send-request':sendFriendRequest();break;case'accept-request':acceptRequest(el.dataset.user);break;case'logout-profile':activeProfile=null;localStorage.removeItem(ACTIVE_KEY);render();break;case'switch-profile':switchProfileModal();break;case'invite-duel':inviteDuel(el.dataset.user);break;case'start-duel':startDuel();break;case'debate-answer':answerDebate(Number(el.dataset.option));break;case'duel-career':startDuelCareer();break;case'final-report':showReport();break;case'post-term':postTerm();break;case'reelection':electionChoice('reelection');break;case'successor':electionChoice('successor');break;case'export':exportFile();break;case'import':importFile();break;case'reset-save':if(confirm('Apagar a partida salva neste navegador? Esta ação não pode ser desfeita.')){localStorage.removeItem(SAVE_KEY);game=null;renderMenu();toast('Salvamento apagado.');}break;case'change-difficulty':page='settings';render();break;case'save-difficulty':{let lv=clamp(Number($('#newDifficultyLevel')?.value||game.difficultyLevel||3),1,5);game.difficultyLevel=lv;game.difficulty=lv<=2?'easy':lv>=4?'hard':'normal';saveGame();render();toast('Dificuldade atualizada.');break;}case'main-menu':saveGame();game=null;renderMenu();break;case'menu-duel':page='players';if(loadGame()){render();go('players');}else{game=freshGame({});render();go('players');}break;}}
 );document.addEventListener('input',e=>{if(e.target.id==='taxRange')$('#taxValue').textContent=fmt(Number(e.target.value),1)+'%';if(['lawSpend','lawTax','lawIntensity','lawPriority','lawComplexity','lawMonths'].includes(e.target.id))updateLawPreview();if(e.target.id==='cfgDifficultyLevel')$('#cfgDifficultyLabel').textContent=['','Muito fácil','Fácil','Normal','Difícil','Muito difícil'][Number(e.target.value)];if(e.target.id==='newDifficultyLevel')$('#newDifficultyLabel').textContent=['','Muito fácil','Fácil','Normal','Difícil','Muito difícil'][Number(e.target.value)];if(e.target.matches('[data-budget],[data-security]')){let b=e.target.closest('.range-row')?.querySelector('b');if(b)b.textContent=fmt(Number(e.target.value),0);}});$('#importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let g=JSON.parse(await f.text());if(g.version!==1||!g.economy||!g.politics||!g.budget)throw new Error('Arquivo incompatível');game=migrateGame(g);if(beginElectionCampaign()){}saveGame();page='home';render();if(game.election?.status==='campaign')showElectionModal();else showNextQueuedEvent();toast('Partida carregada com sucesso.');}catch(err){toast('Arquivo inválido ou incompatível.');}e.target.value='';});document.addEventListener('change',e=>{if(e.target.id==='cfgCountry'){const cp=getCountryProfile(e.target.value);const lab=$('#cfgExecutiveLabel');if(lab)lab.textContent=cp.id==='ESP'?'Nome do Presidente do Governo':'Nome do chefe do Executivo';}if(e.target.id==='autoSave'){game.settings.autoSave=e.target.checked;try{localStorage.setItem(SAVE_KEY,JSON.stringify(game));toast('Preferência atualizada.');}catch(err){toast('Não foi possível gravar a preferência.');}}});}
function switchProfileModal(){profiles=getProfiles();openModal('Trocar de perfil',`<p>Selecione outro perfil salvo neste navegador para aceitar pedidos ou jogar a vez do outro participante.</p><div class="stack">${profiles.map(p=>`<button class="event-choice" data-action="login-profile" data-user="${esc(p.username)}"><span><b>${p.avatar} ${esc(p.displayName)}</b><small>@${esc(p.username)}</small></span><span>›</span></button>`).join('')}</div>`);}
function loginProfile(u){let p=getProfiles().find(x=>x.username===u);if(!p)return;openModal('Entrar em @'+esc(u),`<p>Digite a senha local deste perfil.</p><div class="field"><label>Senha</label><input type="password" id="loginPass"/></div>`,`<button class="btn btn-ghost" data-action="close-modal">Cancelar</button><button class="btn btn-primary" data-action="confirm-login" data-user="${esc(u)}">Entrar</button>`);}
function renderMenuHistory(){let h=[];try{h=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch(e){}openModal('Histórico de governos',h.length?`<div class="stack">${h.map(x=>`<div class="list-item"><b>${esc(x.president)}</b><div class="muted tiny">${esc(x.party)} · nota ${fmt(x.score,1)} · aprovação ${fmt(x.approval,0)}%</div></div>`).join('')}</div>`:'<div class="empty">Nenhum mandato concluído ainda.</div>');}
function finishLogin(u){let p=getProfiles().find(x=>x.username===u);if(!p||hashPass($('#loginPass').value)!==p.passwordHash){toast('Senha incorreta.');return;}activeProfile=u;localStorage.setItem(ACTIVE_KEY,u);closeModal();render();toast('Perfil conectado.');}
// Intercept additional profile login actions after common delegation.
document.addEventListener('click',e=>{let x=e.target.closest('[data-action]');if(!x)return;if(x.dataset.action==='login-profile')loginProfile(x.dataset.user);if(x.dataset.action==='confirm-login')finishLogin(x.dataset.user);});
function init(){profiles=getProfiles();activeProfile=localStorage.getItem(ACTIVE_KEY);if(activeProfile&&!profiles.some(p=>p.username===activeProfile)){activeProfile=null;localStorage.removeItem(ACTIVE_KEY);}bindGlobal();if(loadGame()){game.unrest=game.unrest??18;game.protests=game.protests||[];page='home';if(beginElectionCampaign())saveGame();render();if(game.election?.status==='campaign')showElectionModal();}else renderMenu();if(onlineInit())onlineAuthRefresh().then(async ok=>{if(ok){let id=localStorage.getItem('brasil2027_room_id');if(id){let q=await onlineClient.from('brasil2027_rooms').select('*').eq('id',id).maybeSingle();if(q.data){onlineRoom=q.data;await onlineWatchRoom();}}}}).catch(e=>console.warn('Online restore:',e.message));}
init();
})();
</script>
